<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 -  Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU",
            authDomain: "task38-f7daa.firebaseapp.com",
            databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com",
            projectId: "task38-f7daa",
            storageBucket: "task38-f7daa.firebasestorage.app",
            messagingSenderId: "655282407518",
            appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background: radial-gradient(circle at center, #141414 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            padding: 20px;
        }

        /* Gold Glow Background Blob */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: #d4af37;
            filter: blur(180px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background: rgba(20, 20, 20, 0.8);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .welcome-text {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Input Fields */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i.icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px 15px 15px 45px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* Password Toggle */
        .toggle-pass {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .toggle-pass:hover { color: #d4af37; }

        /* Remember Me & Options */
        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-label input {
            display: none;
        }

        .checkbox-custom {
            width: 16px;
            height: 16px;
            border: 1px solid #555;
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .remember-label input:checked + .checkbox-custom {
            background: #d4af37;
            border-color: #d4af37;
            color: black;
        }

        .checkbox-custom::after {
            content: '\f00c';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            font-size: 10px;
            display: none;
        }
        
        .remember-label input:checked + .checkbox-custom::after {
            display: block;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #b8860b, #d4af37, #f1c40f, #b8860b);
            background-size: 300% 100%;
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.4s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-login:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }

        .footer a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .footer a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Error Message */
        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="header">
            <div class="logo-text">TASK28</div>
            <div class="welcome-text">Sign in to your premium account</div>
        </div>

        <div class="error-msg" id="errorMsg">Incorrect Email or Password</div>

        <div class="input-group">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="email" class="form-control" placeholder="Gmail Address">
        </div>

        <div class="input-group">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="password" class="form-control" placeholder="Password">
            <i class="fas fa-eye toggle-pass" onclick="togglePass()"></i>
        </div>

        <div class="options">
            <label class="remember-label">
                <input type="checkbox" id="rememberMe">
                <span class="checkbox-custom"></span>
                Remember Password
            </label>
            <!-- <a href="#" style="color: #666; text-decoration: none;">Forgot?</a> -->
        </div>

        <button class="btn-login" onclick="handleLogin()">ACCESS ACCOUNT</button>

        <div class="footer">
            Don't have an account? <a href="Registration.html">Register Now</a>
        </div>
    </div>

    <script>
        // Password Hide/Show Function
        function togglePass() {
            const passInput = document.getElementById("password");
            const icon = document.querySelector(".toggle-pass");

            if (passInput.type === "password") {
                passInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                icon.style.color = "#d4af37";
            } else {
                passInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                icon.style.color = "#666";
            }
        }

        // Login Function
        function handleLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            const btn = document.querySelector(".btn-login");

            // Basic Validation
            if (!email || !password) {
                errorMsg.innerText = "Please fill in all fields.";
                errorMsg.style.display = "block";
                return;
            }

            // Button Loading State
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFYING...';
            btn.style.opacity = "0.7";

            // Firebase Login
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Success
                    errorMsg.style.display = "none";
                    
                    // Check Admin or User
                    if(email === "rafsanvai388@gmail.com") {
                        window.location.href = "Admin_home.html";
                    } else {
                        window.location.href = "Home.html";
                    }
                })
                .catch((error) => {
                    // Error Handling
                    btn.innerHTML = "ACCESS ACCOUNT";
                    btn.style.opacity = "1";
                    errorMsg.style.display = "block";
                    
                    if(error.code === "auth/user-not-found") {
                        errorMsg.innerText = "No account found with this Gmail.";
                    } else if(error.code === "auth/wrong-password") {
                        errorMsg.innerText = "Incorrect Password.";
                    } else {
                        errorMsg.innerText = error.message;
                    }
                });
        }
    </script>

</body>
</html>
