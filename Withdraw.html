<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Withdraw</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU",
            authDomain: "task38-f7daa.firebaseapp.com",
            databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com",
            projectId: "task38-f7daa",
            storageBucket: "task38-f7daa.firebasestorage.app",
            messagingSenderId: "655282407518",
            appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505; color: #fff; font-family: 'Montserrat', sans-serif;
            padding: 20px; min-height: 100vh;
        }

        /* HEADER */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;
        }
        .back-btn { color: #d4af37; font-size: 1.5rem; cursor: pointer; }
        .page-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: #d4af37; }

        /* BALANCE CARD */
        .balance-card {
            background: linear-gradient(135deg, #111, #000);
            padding: 30px; border-radius: 20px; border: 1px solid #d4af37;
            text-align: center; margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }
        .bal-label { font-size: 0.9rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        .bal-amount {
            font-family: 'Orbitron', sans-serif; font-size: 3rem; color: #fff;
            margin: 10px 0; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .min-text { font-size: 0.8rem; color: #d4af37; background: rgba(212,175,55,0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; }

        /* FORM */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        
        .input-box {
            position: relative; background: #111; border: 1px solid #333; border-radius: 10px;
        }
        .input-box i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #d4af37;
        }
        .input-box input, .input-box select {
            width: 100%; background: transparent; border: none; padding: 15px 15px 15px 45px;
            color: #fff; font-size: 1rem; outline: none; font-family: 'Montserrat', sans-serif;
            appearance: none; /* Remove default arrow */
        }
        
        /* Custom Arrow for Select */
        .select-arrow {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: #666; pointer-events: none;
        }

        .withdraw-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(45deg, #d4af37, #b8860b);
            border: none; border-radius: 10px; margin-top: 10px;
            color: #000; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2); transition: 0.3s;
        }
        .withdraw-btn:hover { transform: translateY(-2px); }

        /* HISTORY */
        .history-section { margin-top: 40px; }
        .h-title { font-size: 1rem; color: #fff; margin-bottom: 15px; border-left: 4px solid #d4af37; padding-left: 10px; }
        
        .history-item {
            background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222;
        }
        .h-left div { font-size: 0.8rem; color: #666; }
        .h-left strong { font-size: 1.1rem; color: #fff; }
        
        .badge { padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
        .b-pending { background: #333; color: #aaa; }
        .b-paid { background: #27ae60; color: #fff; }
        .b-rejected { background: #c0392b; color: #fff; }

    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">WITHDRAW</div>
        <div></div>
    </div>

    <div class="balance-card">
        <div class="bal-label">Available Balance</div>
        <div class="bal-amount">$<span id="myBal">0.00</span></div>
        <div class="min-text">Minimum Withdraw: $2.00</div>
    </div>

    <!-- Payment Method Selection -->
    <div class="form-group">
        <label class="form-label">Select Payment Method</label>
        <div class="input-box">
            <i class="fas fa-university"></i>
            <select id="methodSelect" onchange="updateUI()">
                <option value="USDT">USDT (BEP20)</option>
                <option value="SHOPPING28">SHOPPING28 ID</option>
            </select>
            <i class="fas fa-chevron-down select-arrow"></i>
        </div>
    </div>

    <!-- Dynamic Input Field -->
    <div class="form-group">
        <label class="form-label" id="destLabel">Wallet Address</label>
        <div class="input-box">
            <i class="fas fa-wallet" id="destIcon"></i>
            <input type="text" id="destination" placeholder="Paste USDT (BEP20) Address">
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Amount (USD)</label>
        <div class="input-box">
            <i class="fas fa-dollar-sign"></i>
            <input type="number" id="amount" placeholder="0.00">
        </div>
    </div>

    <button class="withdraw-btn" onclick="submitWithdraw()">REQUEST WITHDRAW</button>

    <div class="history-section">
        <div class="h-title">Recent Transactions</div>
        <div id="historyList">
            <!-- Items loaded via JS -->
            <div style="text-align:center; color:#444; font-size:0.9rem; padding:20px;">Loading History...</div>
        </div>
    </div>

    <script>
        let currentBalance = 0;

        auth.onAuthStateChanged(user => {
            if(user) {
                // Get Balance
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    currentBalance = parseFloat(data.balance || 0);
                    document.getElementById('myBal').innerText = currentBalance.toFixed(2);
                });

                // Load History
                loadHistory(user.uid);
            } else {
                window.location.href = "Login.html";
            }
        });

        // Change UI based on Dropdown Selection
        function updateUI() {
            const method = document.getElementById('methodSelect').value;
            const label = document.getElementById('destLabel');
            const icon = document.getElementById('destIcon');
            const input = document.getElementById('destination');

            if(method === "USDT") {
                label.innerText = "Wallet Address";
                icon.className = "fas fa-wallet";
                input.placeholder = "Paste USDT (BEP20) Address";
            } else {
                label.innerText = "Shopping28 User ID";
                icon.className = "fas fa-id-card";
                input.placeholder = "Enter Your Shopping28 ID";
            }
        }

        function submitWithdraw() {
            const method = document.getElementById('methodSelect').value;
            const dest = document.getElementById('destination').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if(!amount || !dest) {
                alert("Please fill all fields."); return;
            }

            if(amount < 2) {
                alert("Minimum withdraw is $2.00"); return;
            }

            if(amount > currentBalance) {
                alert("Insufficient Balance!"); return;
            }

            // Process Request
            if(confirm(`Confirm withdraw of $${amount} via ${method}?`)) {
                const uid = auth.currentUser.uid;
                
                // 1. Deduct Balance
                db.ref('users/' + uid).update({
                    balance: currentBalance - amount
                }).then(() => {
                    // 2. Create Request
                    let methodText = (method === "USDT") ? "USDT (BEP20)" : "SHOPPING28 ID";

                    db.ref('withdrawals').push({
                        uid: uid,
                        amount: amount,
                        destination: dest, // Address or ShopID
                        method: methodText,
                        status: "pending",
                        date: new Date().toISOString()
                    });
                    
                    alert("Request Submitted Successfully!");
                    document.getElementById('amount').value = "";
                    document.getElementById('destination').value = "";
                });
            }
        }

        function loadHistory(uid) {
            db.ref('withdrawals').orderByChild('uid').equalTo(uid).on('value', snap => {
                const list = document.getElementById('historyList');
                list.innerHTML = "";
                
                if(!snap.exists()) {
                    list.innerHTML = '<div style="text-align:center; color:#444;">No transactions yet.</div>';
                    return;
                }

                const items = [];
                snap.forEach(c => items.push(c.val()));
                items.reverse(); // Newest first

                items.forEach(item => {
                    let badgeClass = "b-pending";
                    if(item.status === "paid") badgeClass = "b-paid";
                    if(item.status === "rejected") badgeClass = "b-rejected";

                    const date = item.date.split('T')[0];
                    const methodShort = item.method.includes("USDT") ? "USDT" : "SHOP ID";

                    const html = `
                        <div class="history-item">
                            <div class="h-left">
                                <strong>$${parseFloat(item.amount).toFixed(2)}</strong>
                                <div>${methodShort}: ${item.destination}</div>
                                <div style="font-size:0.7rem; color:#444;">${date}</div>
                            </div>
                            <span class="badge ${badgeClass}">${item.status.toUpperCase()}</span>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            });
        }
    </script>
</body>
</html>
