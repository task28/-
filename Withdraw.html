<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Withdraw Funds</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* Background Glow */
        .bg-glow {
            position: fixed; top: -10%; right: -10%; width: 80%; height: 80%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
        }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 10, 0.9);
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn { font-size: 1.2rem; color: #fff; cursor: pointer; }
        .page-title { font-size: 1.1rem; font-weight: 700; color: #d4af37; letter-spacing: 2px; }

        /* WALLET CARD */
        .wallet-card {
            margin: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
            border-radius: 20px; padding: 25px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .wallet-card::before {
            content: ''; position: absolute; width: 100px; height: 100px;
            background: rgba(212, 175, 55, 0.2); filter: blur(50px); top: -20px; left: -20px;
        }

        .bal-label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .bal-amount {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem;
            color: #fff; margin: 10px 0; font-weight: 700;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .min-info { font-size: 0.75rem; color: #d4af37; background: rgba(212, 175, 55, 0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; }

        /* FORM SECTION */
        .form-container { padding: 0 20px; }
        
        .input-group { margin-bottom: 20px; }
        .label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #aaa; }
        
        .input-box {
            display: flex; align-items: center;
            background: #111; border: 1px solid #333;
            border-radius: 12px; padding: 0 15px;
            transition: 0.3s;
        }
        .input-box:focus-within { border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.1); }
        
        .input-icon { color: #d4af37; font-size: 1.1rem; margin-right: 10px; }
        
        .input-field, .select-field {
            width: 100%; background: transparent; border: none;
            padding: 15px 0; color: #fff; font-size: 1rem;
            font-family: 'Montserrat', sans-serif; outline: none;
        }
        .select-field { cursor: pointer; appearance: none; }
        option { background: #000; color: #fff; }

        .withdraw-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(90deg, #b8860b, #d4af37, #f1c40f);
            border: none; border-radius: 12px;
            color: #000; font-weight: 800; font-size: 1rem;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: 0.3s; margin-top: 10px;
        }
        .withdraw-btn:active { transform: scale(0.98); }
        .withdraw-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }

        /* HISTORY SECTION */
        .history-container { margin-top: 40px; padding: 0 20px; }
        .h-header { font-size: 1rem; color: #fff; margin-bottom: 15px; border-left: 4px solid #d4af37; padding-left: 10px; font-weight: 700; }
        
        .history-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
        
        .h-item {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid #222; border-radius: 10px;
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s;
        }
        .h-item:hover { transform: translateY(-2px); border-color: #444; }
        
        .h-left { display: flex; align-items: center; gap: 12px; }
        .method-icon { 
            width: 40px; height: 40px; background: rgba(255, 255, 255, 0.05); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #d4af37; font-size: 1.1rem;
        }
        
        .h-details h4 { font-size: 1rem; color: #fff; margin-bottom: 3px; font-weight: bold; }
        .h-details p { font-size: 0.75rem; color: #888; }
        
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .b-pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; }
        .b-paid { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }
        .b-rejected { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid #e74c3c; }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">WITHDRAW</div>
        <div style="width: 20px;"></div>
    </div>

    <!-- BALANCE CARD -->
    <div class="wallet-card">
        <div class="bal-label">Available Balance</div>
        <div class="bal-amount">$<span id="myBal">0.00</span></div>
        <div class="min-info" id="minInfo"><i class="fas fa-info-circle"></i> Loading Min Withdraw...</div>
    </div>

    <!-- FORM -->
    <div class="form-container">
        
        <div class="input-group">
            <label class="label">Payment Method</label>
            <div class="input-box">
                <i class="fas fa-university input-icon"></i>
                <select class="select-field" id="methodSelect" onchange="updateUI()">
                    <option value="USDT">USDT (BEP20)</option>
                    <option value="SHOPPING28">SHOPPING28 ID</option>
                    <option value="BINANCE">Binance Pay ID</option>
                    <option value="NAGAD">Nagad (Personal)</option>
                    <option value="BKASH">Bkash (Personal)</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label class="label" id="destLabel">Wallet Address</label>
            <div class="input-box">
                <i class="fas fa-wallet input-icon" id="destIcon"></i>
                <input type="text" class="input-field" id="destination" placeholder="Paste Address Here">
            </div>
        </div>

        <div class="input-group">
            <label class="label">Amount (USD)</label>
            <div class="input-box">
                <i class="fas fa-dollar-sign input-icon"></i>
                <input type="number" class="input-field" id="amount" placeholder="0.00">
            </div>
        </div>

        <button class="withdraw-btn" id="submitBtn" onclick="submitWithdraw()">REQUEST WITHDRAW</button>
    </div>

    <!-- HISTORY -->
    <div class="history-container">
        <div class="h-header">Recent Transactions</div>
        <div class="history-list" id="historyList">
            <div style="text-align:center; color:#666; font-size:0.9rem; padding:20px;">Loading History...</div>
        </div>
    </div>

    <script>
        let currentBalance = 0;
        let minWithdraw = 2.00; // Default fallback
        let currentUser = null;

        // 1. Auth & Data Load
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                loadUserData();
                loadAdminSettings();
                loadHistory();
            } else {
                window.location.href = "registration_login.html";
            }
        });

        // 2. Load User Balance
        function loadUserData() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const data = snap.val();
                if(data) {
                    currentBalance = parseFloat(data.balance || 0);
                    document.getElementById('myBal').innerText = currentBalance.toFixed(2);
                }
            });
        }

        // 3. Load Min Withdraw Limit from Admin
        function loadAdminSettings() {
            db.ref('adminSettings/minWithdraw').on('value', snap => {
                if(snap.exists()) {
                    minWithdraw = parseFloat(snap.val());
                }
                document.getElementById('minInfo').innerHTML = `<i class="fas fa-info-circle"></i> Min Withdraw: $${minWithdraw.toFixed(2)}`;
            });
        }

        // 4. Update UI based on Method
        function updateUI() {
            const method = document.getElementById('methodSelect').value;
            const label = document.getElementById('destLabel');
            const icon = document.getElementById('destIcon');
            const input = document.getElementById('destination');

            if(method === "USDT") {
                label.innerText = "Wallet Address (BEP20)";
                icon.className = "fas fa-wallet input-icon";
                input.placeholder = "Paste USDT Address";
            } else if(method === "SHOPPING28") {
                label.innerText = "Shopping28 User ID";
                icon.className = "fas fa-id-card input-icon";
                input.placeholder = "Enter User ID";
            } else if(method === "BINANCE") {
                label.innerText = "Binance Pay ID";
                icon.className = "fas fa-qrcode input-icon";
                input.placeholder = "Enter Binance Pay ID";
            } else {
                label.innerText = method + " Number";
                icon.className = "fas fa-mobile-alt input-icon";
                input.placeholder = "Enter Mobile Number";
            }
        }

        // 5. Submit Request Logic (Updated to Connect with History.html)
        function submitWithdraw() {
            const method = document.getElementById('methodSelect').value;
            const dest = document.getElementById('destination').value.trim();
            const amountStr = document.getElementById('amount').value;
            const amount = parseFloat(amountStr);
            const btn = document.getElementById('submitBtn');

            // Validation
            if(!amount || !dest) return alert("Please fill all fields.");
            if(amount < minWithdraw) return alert(`Minimum withdraw amount is $${minWithdraw.toFixed(2)}`);
            if(amount > currentBalance) return alert("Insufficient Balance!");

            // Confirmation
            if(!confirm(`Withdraw $${amount.toFixed(2)} via ${method}?`)) return;

            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            // 1. Transaction Data (For Admin Panel)
            const withdrawalRef = db.ref('withdrawals').push();
            const withdrawId = withdrawalRef.key;
            
            const withdrawData = {
                id: withdrawId,
                uid: currentUser.uid,
                email: currentUser.email,
                amount: amount,
                destination: dest,
                method: method,
                status: "pending", 
                date: new Date().toISOString()
            };

            // 2. History Data (For History.html Page)
            const historyRef = db.ref('history/' + currentUser.uid).push();
            const historyData = {
                amount: amount,
                type: 'withdraw', // This links to the 'Withdrawal' filter in History.html
                desc: `Withdraw via ${method}`,
                date: new Date().toISOString(),
                status: 'pending'
            };

            // 3. Execute Updates (Deduct Balance -> Save Admin Data -> Save User History)
            db.ref('users/' + currentUser.uid).update({
                balance: (currentBalance - amount).toFixed(4)
            }).then(() => {
                // Save to Admin node
                return withdrawalRef.set(withdrawData);
            }).then(() => {
                // Save to History node
                return historyRef.set(historyData);
            }).then(() => {
                alert("Withdrawal Request Submitted!");
                // Reset Form
                document.getElementById('amount').value = "";
                document.getElementById('destination').value = "";
                btn.disabled = false;
                btn.innerText = "REQUEST WITHDRAW";
            }).catch(error => {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "REQUEST WITHDRAW";
            });
        }

        // 6. Load Transaction History (For this page bottom list)
        function loadHistory() {
            db.ref('withdrawals').orderByChild('uid').equalTo(currentUser.uid).on('value', snap => {
                const list = document.getElementById('historyList');
                list.innerHTML = "";

                if(!snap.exists()) {
                    list.innerHTML = `
                        <div style="text-align:center; padding: 30px; color:#555;">
                            <i class="fas fa-history" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
                            <p>No withdrawal history found.</p>
                        </div>`;
                    return;
                }

                // Convert Object to Array
                let items = [];
                snap.forEach(child => {
                    items.push(child.val());
                });

                // Sort by Date (Newest First)
                items.sort((a, b) => new Date(b.date) - new Date(a.date));

                items.forEach(item => {
                    let badgeClass = "b-pending";
                    let statusText = "Pending";
                    let status = item.status ? item.status.toLowerCase() : "pending";

                    if(status === "approved" || status === "paid" || status === "success") {
                        badgeClass = "b-paid";
                        statusText = "Success";
                    } else if(status === "rejected" || status === "cancel" || status === "failed") {
                        badgeClass = "b-rejected";
                        statusText = "Rejected";
                    }

                    // Format Date nicely
                    const dateObj = new Date(item.date);
                    const dateStr = dateObj.toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'short'
                    }) + ", " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    // Determine Icon
                    let iconClass = "fas fa-dollar-sign";
                    if(item.method === "USDT" || item.method === "BINANCE") iconClass = "fas fa-coins";
                    else if(item.method === "BKASH" || item.method === "NAGAD") iconClass = "fas fa-mobile-alt";
                    else if(item.method === "SHOPPING28") iconClass = "fas fa-shopping-bag";

                    // Truncate long address
                    let displayDest = item.destination.length > 15 ? item.destination.substring(0, 8) + "..." + item.destination.substring(item.destination.length - 4) : item.destination;

                    const html = `
                        <div class="h-item">
                            <div class="h-left">
                                <div class="method-icon"><i class="${iconClass}"></i></div>
                                <div class="h-details">
                                    <h4>$${parseFloat(item.amount).toFixed(2)}</h4>
                                    <p>${item.method} • ${displayDest}</p>
                                    <p style="font-size:0.65rem; margin-top:3px; color:#666;">${dateStr}</p>
                                </div>
                            </div>
                            <span class="badge ${badgeClass}">${statusText}</span>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            });
        }
    </script>
</body>
</html>
