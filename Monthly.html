<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Monthly Plans</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #050505; color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            padding-bottom: 60px; 
        }

        /* Header */
        .header { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn { color: #fff; font-size: 1.2rem; cursor: pointer; }
        .page-title { color: #d4af37; font-weight: 800; letter-spacing: 1px; font-size: 1.1rem; }

        /* Container */
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        .info-text {
            text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 25px;
        }

        /* Plan Cards */
        .plan-grid { display: grid; gap: 15px; }

        .plan-card { 
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d); 
            padding: 20px; border-radius: 15px; 
            border: 1px solid #333; position: relative; overflow: hidden;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .plan-card:hover { border-color: #d4af37; transform: scale(1.02); }

        .p-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .p-name { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .p-price { color: #d4af37; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 1.1rem; }

        .p-desc { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; line-height: 1.5; }

        .telegram-btn { 
            width: 100%; padding: 12px; 
            background: #0088cc; /* Telegram Blue */
            border: none; border-radius: 8px; color: #fff; 
            font-weight: bold; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .telegram-btn:hover { background: #0099e6; }
        .telegram-btn i { font-size: 1.2rem; }

        /* Special Gold Border for High Plans */
        .gold-plan { border: 1px solid #d4af37; background: rgba(212, 175, 55, 0.05); }

    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">MONTHLY PLANS</div>
        <div style="width:20px;"></div>
    </div>

    <div class="container">
        <p class="info-text">Choose a 30-day plan. Tap apply to send your details to Admin via Telegram.</p>

        <div class="plan-grid" id="planList">
            <!-- Plans will load here -->
        </div>
    </div>

    <script>
        // *** ADMIN TELEGRAM USERNAME UPDATED ***
        const ADMIN_TELEGRAM = "RAFSAN_ART_CREATOR"; 

        const monthlyPlans = [
            { id: 1, name: "Monthly Basic", price: "2 Credits", desc: "Valid for 30 days. Daily 25 Tasks. Standard Support." },
            { id: 2, name: "Monthly Gold", price: "5 Credits", desc: "Valid for 30 days. Daily 50 Tasks. Faster Withdrawals." },
            { id: 3, name: "Monthly Platinum", price: "10 Credits", desc: "Valid for 30 days. Daily 100 Tasks. Priority Support.", isGold: true },
            { id: 4, name: "Monthly Diamond", price: "20 Credits", desc: "Valid for 30 days. Daily 200 Tasks. VIP Manager.", isGold: true }
        ];

        let userData = {};

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    userData = snap.val();
                    renderPlans();
                });
            } else {
                window.location.href = 'Login.html';
            }
        });

        function renderPlans() {
            const list = document.getElementById('planList');
            list.innerHTML = "";

            monthlyPlans.forEach(plan => {
                const specialClass = plan.isGold ? 'gold-plan' : '';
                
                const html = `
                    <div class="plan-card ${specialClass}">
                        <div class="p-header">
                            <div class="p-name">${plan.name}</div>
                            <div class="p-price">${plan.price}</div>
                        </div>
                        <div class="p-desc">${plan.desc}</div>
                        <button class="telegram-btn" onclick="contactAdmin('${plan.name}', '${plan.price}')">
                            <i class="fab fa-telegram-plane"></i> Apply via Telegram
                        </button>
                    </div>
                `;
                list.innerHTML += html;
            });
        }

        function contactAdmin(planName, price) {
            if(!userData.email) return alert("Loading user data...");

            // Message Format
            const text = `
💎 *MONTHLY PLAN REQUEST*
--------------------------
👤 *User:* ${userData.name}
📧 *Email:* ${userData.email}
🆔 *UID:* ${userData.uid}
--------------------------
📦 *Plan:* ${planName}
💰 *Price:* ${price}
--------------------------
Please verify and activate my plan.
            `.trim();

            const encodedText = encodeURIComponent(text);
            const url = `https://t.me/${ADMIN_TELEGRAM}?text=${encodedText}`;
            
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
