    <style>

            padding: 8px;

            border: 1px solid #333;
        }
        .limit-info strong { color: #d4af37; }

        /* FILTER TABS */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .filter-btn {
            background: #111;

        }

        /* TRANSACTION LIST */
        .history-list { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .h-card {
            background: #111; 
            border: 1px solid #222; 
            border-radius: 12px;
            padding: 18px 15px;

            transition: 0.3s;

        .h-card.type-gift { border-left-color: #9b59b6; }
        
        .h-left { flex: 1; }
        .h-left h4 {

            display: flex;
            align-items: center;
            gap: 8px;
        }
        .h-left p {

            color: #666; 
        }
        
        .h-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .type-income .h-icon { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .type-expense .h-icon { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .type-commission .h-icon { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .type-gift .h-icon { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
        
        .h-right { 
            text-align: right; 
            min-width: 80px;
        }
        .amount { 
            font-weight: 800; 
            font-size: 1.1rem; 
            font-family: 'Orbitron', sans-serif;
        }
        .plus { color: #2ecc71; }
        .minus { color: #e74c3c; }

            font-size: 0.65rem;

            border-radius: 10px;

        .badge-commission { background: rgba(52, 152, 219, 0.15); color: #3498db; }

        .badge-gift { background: rgba(155, 89, 182, 0.15); color: #9b59b6; }

        .empty-msg {

            border: 2px dashed #333;

        }

        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

<body>

    <div class="header">
        <i class="fas fa-arrow-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">
            <i class="fas fa-history"></i> 
            HISTORY 
            <span class="count-badge" id="totalCount">0/20</span>
        </div>
        <div style="width: 40px;"></div>
    </div>

    <!-- SUMMARY -->
    <div class="stats-container">
        <div class="stat-card income">
            <div class="stat-icon"><i class="fas fa-arrow-down"></i></div>
            <div class="stat-label">Total Income</div>
            <div class="stat-value" id="totalIncome">$0.00</div>
        </div>
        
        <div class="stat-card expense">
            <div class="stat-icon"><i class="fas fa-arrow-up"></i></div>
            <div class="stat-label">Total Expense</div>
            <div class="stat-value" id="totalExpense">$0.00</div>
        </div>
        
        <div class="stat-card net">
            <div class="stat-icon"><i class="fas fa-wallet"></i></div>
            <div class="stat-label">Net Balance</div>
            <div class="stat-value" id="netBalance">$0.00</div>
        </div>
    </div>

    <div class="limit-info">
        <i class="fas fa-info-circle"></i> 
        Showing Last <strong>20</strong> Transactions (Auto-removes old)
    </div>

    <!-- FILTERS -->
    <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterHistory('all')">All</button>
        <button class="filter-btn" onclick="filterHistory('income')">Income</button>
        <button class="filter-btn" onclick="filterHistory('expense')">Expense</button>
        <button class="filter-btn" onclick="filterHistory('commission')">Commission</button>
        <button class="filter-btn" onclick="filterHistory('task')">Tasks</button>
    </div>

    <!-- LIST -->
    <div class="history-list" id="listArea">
        <div class="loading">
            <i class="fas fa-circle-notch"></i>
            Loading transactions...
        </div>
    </div>

    <script>
        let allTransactions = [];
        let currentFilter = 'all';
        const MAX_HISTORY = 20; // সর্বোচ্চ ২০টা রাখবে

        auth.onAuthStateChanged(user => {
            if(user) {
                // প্রথমে পুরনো ডাটা পরিষ্কার করবে, তারপর দেখাবে
                cleanupOldHistory(user.uid).then(() => {
                    loadHistory(user.uid);
                });
            } else {
                window.location.href = "registration_login.html";
            }
        });

        // পুরনো history ডিলিট করে শুধু ২০টা রাখবে
        async function cleanupOldHistory(uid) {
            const historyRef = db.ref('history/' + uid);
            const snapshot = await historyRef.orderByChild('date').once('value');
            
            const count = snapshot.numChildren();
            if(count > MAX_HISTORY) {
                const toDelete = count - MAX_HISTORY;
                let deleted = 0;
                
                // পুরনোগুলো ডিলিট (প্রথম যেগুলো পাবে)
                snapshot.forEach(child => {
                    if(deleted < toDelete) {
                        historyRef.child(child.key).remove();
                        deleted++;
                    }
                });
                
                console.log(`Cleaned up ${toDelete} old history entries`);
            }
        }

        function loadHistory(uid) {
            // শেষ ২০টা লোড করবে
            db.ref('history/' + uid).limitToLast(MAX_HISTORY).on('value', snap => {
                const list = document.getElementById('listArea');
                
                if(!snap.exists()) {
                    list.innerHTML = `
                        <div class="empty-msg">
                            <i class="fas fa-receipt"></i>
                            <p>No transactions found.<br>Start completing tasks!</p>
                        </div>`;
                    updateCounts([]);
                    return;
                }

                allTransactions = [];
                snap.forEach(child => {
                    allTransactions.push({
                        key: child.key,
                        ...child.val()
                    });
                });
                
                // নতুন থেকে পুরনো সাজাবে
                allTransactions.reverse();
                
                // কাউন্ট আপডেট (২০/২০ দেখাবে)
                document.getElementById('totalCount').innerText = `${allTransactions.length}/${MAX_HISTORY}`;
                
                updateCounts(allTransactions);
                displayTransactions(allTransactions, currentFilter);
            });
        }

        function updateCounts(transactions) {
            let income = 0;
            let expense = 0;

            transactions.forEach(item => {
                const amount = parseFloat(item.amount || 0);
                
                if(item.type === 'withdraw') {
                    expense += amount;
                } else {
                    income += amount;
                }
            });

            const net = income - expense;

            animateValue('totalIncome', income, '$');
            animateValue('totalExpense', expense, '$');
            animateValue('netBalance', net, '$');
        }

        function animateValue(elementId, value, prefix = '') {
            const el = document.getElementById(elementId);
            const start = parseFloat(el.innerText.replace(/[^0-9.-]+/g,"")) || 0;
            const end = value;
            const duration = 800;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const current = start + (end - start) * ease;
                
                el.innerText = prefix + current.toFixed(2);
                
                if(progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function filterHistory(type) {
            currentFilter = type;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase().includes(type) || (type === 'all' && btn.innerText === 'All')) {
                    btn.classList.add('active');
                }
            });
            
            displayTransactions(allTransactions, type);
        }

        function displayTransactions(items, filter) {
            const list = document.getElementById('listArea');
            list.innerHTML = '';

            const filtered = filter === 'all' ? items : items.filter(item => {
                if(filter === 'income') return item.type !== 'withdraw';
                if(filter === 'expense') return item.type === 'withdraw';
                return item.type === filter;
            });

            if(filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-search"></i>
                        <p>No ${filter} transactions found.</p>
                    </div>`;
                return;
            }

            filtered.forEach((item, index) => {
                const isIncome = item.type !== 'withdraw';
                const icon = getIcon(item.type);
                const sign = isIncome ? '+' : '-';
                const colorClass = isIncome ? 'plus' : 'minus';
                const cardClass = getCardClass(item.type);
                const badgeClass = getBadgeClass(item.type);
                
                const dateObj = new Date(item.date);
                const dateStr = dateObj.toLocaleDateString('en-US', { 
                    month: 'short', day: 'numeric' 
                });
                const timeStr = dateObj.toLocaleTimeString('en-US', { 
                    hour: '2-digit', minute: '2-digit' 
                });
                
                // সবচেয়ে নতুন (প্রথম) আইটেমে NEW ট্যাগ দেখাবে
                const newTag = (index === 0 && filter === 'all') ? '<span class="new-tag">NEW</span>' : '';

                const html = `
                    <div class="h-card ${cardClass}" style="animation-delay: ${index * 0.05}s">
                        <div class="h-left">
                            <h4>
                                <span class="h-icon"><i class="fas ${icon}"></i></span>
                                ${item.desc || item.type}
                                ${newTag}
                            </h4>
                            <p><i class="far fa-clock"></i> ${dateStr} • ${timeStr}</p>
                        </div>
                        <div class="h-right">
                            <div class="amount ${colorClass}">${sign}$${parseFloat(item.amount).toFixed(2)}</div>
                            <span class="type-badge ${badgeClass}">${item.type}</span>
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }

        function getIcon(type) {
            const icons = {
                'task': 'fa-check-circle',
                'commission': 'fa-users',
                'withdraw': 'fa-arrow-up',
                'gift': 'fa-gift',
                'deposit': 'fa-arrow-down'
            };
            return icons[type] || 'fa-circle';
        }

        function getCardClass(type) {
            const classes = {
                'task': 'type-income',
                'commission': 'type-commission',
                'withdraw': 'type-expense',
                'gift': 'type-gift'
            };
            return classes[type] || 'type-income';
        }

        function getBadgeClass(type) {
            const classes = {
                'task': 'badge-task',
                'commission': 'badge-commission',
                'withdraw': 'badge-withdraw',
                'gift': 'badge-gift'
            };
            return classes[type] || 'badge-task';
        }
    </script>
</body>
