<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Plan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .header-card { background: linear-gradient(45deg, #1a1a1a, #000); border: 1px solid #FFD700; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .level-card { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-select { background: #FFD700; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; color: #000; }
        .btn-buy { background: #00e676; color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        
        /* Modal for Payment */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10; align-items: center; justify-content: center; }
        .modal-box { background: #222; padding: 25px; border-radius: 15px; border: 1px solid #FFD700; text-align: center; max-width: 300px; width: 85%; }
    </style>
</head>
<body>

    <div class="header-card">
        <h2 style="margin:0; color:#FFD700;">Monthly Salary</h2>
        <p style="font-size:0.8rem; opacity:0.7;">Duration: 30 Days</p>
        
        <div style="margin-top:15px; background:rgba(255,255,255,0.1); padding:10px; border-radius:10px;">
            <div style="font-size:0.9rem;">Your Monthly Credits: <strong id="myCredits" style="color:#FFD700;">Loading...</strong></div>
            <div id="buySection" style="display:none;">
                <button class="btn-buy" onclick="openPayModal()">Buy Credits (0.80 USDT)</button>
            </div>
        </div>
    </div>

    <div id="statusMsg" style="color:red; text-align:center; margin-bottom:10px;"></div>
    <div id="levelsContainer"></div>
    
    <a href="home.html" style="display:block; text-align:center; margin-top:20px; color:#aaa; text-decoration:none;">Back to Dashboard</a>

    <!-- PAYMENT MODAL -->
    <div id="payModal" class="modal">
        <div class="modal-box">
            <h3 style="color:#FFD700;">Buy Monthly Access</h3>
            <p>Send 0.80 USDT (BEP20) to get access.</p>
            <div style="background:#333; padding:8px; font-size:0.75rem; word-break:break-all; border-radius:5px; margin:10px 0;">0xYourAdminWalletHere...</div>
            <button class="btn-select" onclick="confirmPayment()">I Sent Payment</button>
            <button style="background:transparent; color:#fff; border:none; margin-top:10px;" onclick="closePayModal()">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const levels = [
            { id: 1, refs: 30, task: 60, reward: 300 },
            { id: 2, refs: 50, task: 100, reward: 500 },
            { id: 3, refs: 100, task: 200, reward: 1000 },
            { id: 4, refs: 200, task: 400, reward: 2200 },
            { id: 5, refs: 300, task: 600, reward: 3500 },
            { id: 6, refs: 400, task: 800, reward: 5000 }
        ];

        let uid = null;
        let credits = 0;
        let hasActiveTarget = false;

        onAuthStateChanged(auth, (user) => {
            if(user) {
                uid = user.uid;
                
                // 1. Check Existing Target
                onValue(ref(db, `users/${uid}/target`), (snap) => {
                    const t = snap.val();
                    if(t && (t.status === 'pending' || t.status === 'active')) {
                        hasActiveTarget = true;
                        document.getElementById('statusMsg').innerText = "⚠️ You already have a Pending or Active target.";
                    }
                    loadData();
                });

                // 2. Load Credits (Initialize to 2 if not set)
                onValue(ref(db, `users/${uid}/credits/monthly`), (snap) => {
                    if(!snap.exists()) {
                        update(ref(db, `users/${uid}/credits`), { monthly: 2 });
                        credits = 2;
                    } else {
                        credits = snap.val();
                    }
                    document.getElementById('myCredits').innerText = credits;
                    document.getElementById('buySection').style.display = credits > 0 ? 'none' : 'block';
                    loadData();
                });
            }
        });

        function loadData() {
            const container = document.getElementById('levelsContainer');
            container.innerHTML = "";
            
            levels.forEach(l => {
                let btnState = `onclick="applyLevel(${l.id})"`;
                let btnTxt = "SELECT";
                let btnStyle = "";

                if(hasActiveTarget || credits < 1) {
                    btnTxt = "LOCKED";
                    btnStyle = "background:#555; cursor:not-allowed;";
                    btnState = "";
                }

                container.innerHTML += `
                <div class="level-card">
                    <div>
                        <div style="color:#FFD700; font-weight:bold;">Level ${l.id}</div>
                        <div style="font-size:0.75rem; color:#ccc;">${l.refs} Ref | ${l.task} Task</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold; color:#00e676;">${l.reward} TK</div>
                        <button class="btn-select" style="${btnStyle}" ${btnState}>${btnTxt}</button>
                    </div>
                </div>`;
            });
        }

        window.applyLevel = (lvlId) => {
            if(credits < 1) return alert("No Credits left!");
            if(!confirm(`Use 1 Monthly Credit to apply for Level ${lvlId}? \nAdmin approval required.`)) return;

            const selected = levels.find(l => l.id === lvlId);

            // Deduct Credit & Set Pending Target
            const updates = {};
            updates[`users/${uid}/credits/monthly`] = credits - 1;
            updates[`users/${uid}/target`] = {
                type: 'monthly',
                level: lvlId,
                status: 'pending', // Pending Admin Approval
                reqRef: selected.refs,
                reqTask: selected.task,
                currentRef: 0,
                currentTask: 0,
                requestDate: Date.now()
            };

            update(ref(db), updates).then(() => {
                alert("Application Sent! Please wait for Admin Approval.");
                window.location.href = "home.html";
            });
        }

        // Payment Simulation
        window.openPayModal = () => document.getElementById('payModal').style.display = 'flex';
        window.closePayModal = () => document.getElementById('payModal').style.display = 'none';
        window.confirmPayment = () => {
            alert("Payment request sent to Admin. Credits will be added upon verification.");
            closePayModal();
        }
    </script>
</body>
</html>
