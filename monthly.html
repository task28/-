<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Monthly Salary</title>
    <!-- Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #FFD700;
            --accent-gold: #D4AF37;
            --bg-body: #050505;
            --card-bg: rgba(20, 20, 20, 0.6);
            --card-border: 1px solid rgba(255, 215, 0, 0.15);
            --glass-blur: blur(12px);
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, #111 0, transparent 50%), 
                radial-gradient(at 50% 0%, #0a0a0a 0, transparent 50%), 
                radial-gradient(at 100% 0%, #111 0, transparent 50%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* CARD STYLE */
        .coming-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Shine Animation Background */
        .coming-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,215,0,0.03), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -50%; } 100% { left: 150%; } }

        /* ICON ANIMATION */
        .icon-box {
            margin-bottom: 20px;
        }
        .icon-box i {
            font-size: 4rem;
            background: linear-gradient(to bottom, #fff, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        /* TEXT STYLES */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 14px;
            color: var(--primary-gold);
            letter-spacing: 4px;
            margin-top: 5px;
            font-weight: 600;
        }
        .description {
            color: #8b9bb4;
            font-size: 13px;
            margin: 20px 0 30px 0;
            line-height: 1.6;
        }

        /* PROGRESS BAR */
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            height: 6px;
            width: 80%;
            margin: 0 auto 30px auto;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 85%; /* Loading percentage */
            background: linear-gradient(90deg, var(--accent-gold), var(--primary-gold));
            border-radius: 50px;
            box-shadow: 0 0 10px var(--primary-gold);
            animation: loading 2s infinite ease-in-out;
        }
        @keyframes loading { 0% { width: 80%; opacity: 0.8; } 50% { width: 85%; opacity: 1; } 100% { width: 80%; opacity: 0.8; } }

        /* COUNTDOWN TIMER */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        .time-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 5px;
        }
        .time-val { font-size: 18px; font-weight: bold; color: #fff; display: block; }
        .time-label { font-size: 10px; color: #888; text-transform: uppercase; }

        /* BACK BUTTON */
        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            background: rgba(255, 215, 0, 0.05);
        }
        .btn-back:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="coming-card">
            
            <!-- Animated Icon -->
            <div class="icon-box">
                <i class="fas fa-rocket"></i>
            </div>

            <!-- Title -->
            <h1>Monthly Salary</h1>
            <div class="subtitle">COMING SOON</div>

            <!-- Description -->
            <p class="description">
                We are preparing the ultimate fixed salary system for our leaders. 
                Get ready to level up your earnings!
            </p>

            <!-- Loading Bar -->
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div style="font-size: 10px; color: #666; margin-top: -25px; margin-bottom: 25px;">Development in progress (85%)</div>

            <!-- Countdown Timer -->
            <div class="timer-grid">
                <div class="time-box">
                    <span class="time-val" id="d">02</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="h">14</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="m">30</span>
                    <span class="time-label">Mins</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="s">45</span>
                    <span class="time-label">Secs</span>
                </div>
            </div>

            <!-- Back Button -->
            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>

        </div>
    </div>

    <script>
        // Fake Countdown Timer Logic
        // Sets a date 3 days from now
        const countDownDate = new Date().getTime() + (3 * 24 * 60 * 60 * 1000);

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("d").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("h").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("m").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("s").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(x);
                document.querySelector('.subtitle').innerText = "LAUNCHING NOW";
            }
        }, 1000);
    </script>

</body>
</html>
