<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Targets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: #FFD700; text-transform: uppercase; letter-spacing: 2px; }
        
        .level-card { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 15px; 
            padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .level-card.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .level-card.active { border: 2px solid #FFD700; background: rgba(255, 215, 0, 0.1); }
        
        .lvl-info h3 { margin: 0; color: #FFD700; font-size: 1.2rem; }
        .lvl-req { font-size: 0.8rem; color: #ccc; margin-top: 5px; }
        .lvl-reward { font-size: 1.2rem; font-weight: bold; color: #00e676; text-align: right; }
        
        .btn-select { 
            background: #FFD700; color: black; border: none; padding: 8px 15px; border-radius: 20px; 
            font-weight: bold; cursor: pointer; margin-top: 5px; 
        }
        
        .status-bar { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(255,0,0,0.1); border: 1px solid red; border-radius: 10px; display: none; }
        .back-btn { color: #888; text-decoration: none; display: block; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Monthly Salary</h2>
        <p style="font-size: 0.9rem; opacity: 0.7;">Select a target. Valid for 30 Days.</p>
    </div>

    <div id="statusMessage" class="status-bar"></div>

    <div id="levelsContainer">
        <!-- Generated by JS -->
    </div>

    <a href="home.html" class="back-btn">Back to Dashboard</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const levels = [
            { id: 1, refs: 30, task: 60, reward: 300 },
            { id: 2, refs: 50, task: 100, reward: 500 },
            { id: 3, refs: 100, task: 200, reward: 1000 },
            { id: 4, refs: 200, task: 400, reward: 2200 },
            { id: 5, refs: 300, task: 600, reward: 3500 },
            { id: 6, refs: 400, task: 800, reward: 5000 }
        ];

        let currentUid = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                checkPlanStatus();
            }
        });

        function checkPlanStatus() {
            onValue(ref(db, 'users/' + currentUid + '/currentPlan'), (snapshot) => {
                const plan = snapshot.val();
                renderLevels(plan);
            });
        }

        function renderLevels(plan) {
            const container = document.getElementById('levelsContainer');
            const statusMsg = document.getElementById('statusMessage');
            container.innerHTML = "";

            let isWeeklyActive = (plan && plan.status === 'active' && plan.type === 'weekly');
            let isMonthlyActive = (plan && plan.status === 'active' && plan.type === 'monthly');

            if(isWeeklyActive) {
                statusMsg.style.display = 'block';
                statusMsg.innerHTML = "🚫 Weekly Plan is Active. You cannot join Monthly Plan now.";
            } else {
                statusMsg.style.display = 'none';
            }

            levels.forEach(lvl => {
                let lockedClass = "";
                let btnHtml = `<button class="btn-select" onclick="activateLevel(${lvl.id})">SELECT</button>`;

                if(isWeeklyActive) {
                    lockedClass = "locked";
                    btnHtml = "<span>Locked</span>";
                } else if(isMonthlyActive) {
                    if(plan.level === lvl.id) {
                        lockedClass = "active";
                        const daysLeft = Math.ceil((plan.endTime - Date.now()) / (1000 * 60 * 60 * 24));
                        btnHtml = `<span style="color:#000; font-weight:bold;">Active (${daysLeft} Days)</span>`;
                    } else {
                        lockedClass = "locked";
                        btnHtml = "<span>Locked</span>";
                    }
                }

                container.innerHTML += `
                <div class="level-card ${lockedClass}">
                    <div class="lvl-info">
                        <h3>Level ${lvl.id}</h3>
                        <div class="lvl-req">
                            <i class="fas fa-users"></i> ${lvl.refs} Refs | 
                            <i class="fas fa-check-circle"></i> ${lvl.task} Tasks
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div class="lvl-reward">${lvl.reward} TK</div>
                        ${btnHtml}
                    </div>
                </div>`;
            });
        }

        window.activateLevel = (levelId) => {
            if(!confirm(`Start Level ${levelId} Monthly Plan? This will lock for 30 days.`)) return;

            const startTime = Date.now();
            const endTime = startTime + (30 * 24 * 60 * 60 * 1000); // 30 Days

            update(ref(db, 'users/' + currentUid + '/currentPlan'), {
                type: 'monthly',
                level: levelId,
                status: 'active',
                startTime: startTime,
                endTime: endTime
            }).then(() => {
                alert("Monthly Plan Activated! Good Luck.");
            });
        }
    </script>
</body>
</html>
