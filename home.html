<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #0a0a0a; --card-bg: rgba(20, 20, 20, 0.6); --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.3); --text-main: #ffffff; }
        body { margin: 0; padding: 20px; background: radial-gradient(circle at top right, #1a1a2e, #000000); color: var(--text-main); font-family: 'Poppins', sans-serif; min-height: 100vh; padding-bottom: 80px; }

        /* PROFILE HEADER */
        .profile-section { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; background: var(--card-bg); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,215,0,0.2); }
        .profile-img-box { position: relative; width: 70px; height: 70px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
        .upload-icon { position: absolute; bottom: 0; right: 0; background: var(--gold); color: #000; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
        .profile-info h3 { margin: 0; font-size: 1.1rem; color: #fff; }
        .profile-details { font-size: 0.75rem; color: #aaa; margin-top: 5px; }
        .uid-badge { background: rgba(255,215,0,0.1); color: var(--gold); padding: 2px 8px; border-radius: 4px; font-weight: bold; }

        /* TARGET BUTTONS */
        .target-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .target-btn { background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border: 1px solid rgba(255,215,0,0.3); padding: 20px 10px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .target-btn.active { border-color: var(--gold); background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 15px var(--gold-glow); }
        .target-btn.disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        .target-btn i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .target-label { font-size: 0.9rem; font-weight: bold; }
        .credit-badge { position: absolute; top: 10px; right: 10px; background: #ff4444; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }

        /* MENU GRID (Existing) */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); border-color: var(--gold); }
        .menu-item i { font-size: 1.8rem; color: var(--gold); margin-bottom: 10px; display: block; }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- PROFILE SECTION -->
    <div class="profile-section">
        <div class="profile-img-box" onclick="document.getElementById('fileUpload').click()">
            <img src="https://via.placeholder.com/70" id="profilePic" class="profile-img" alt="Profile">
            <div class="upload-icon"><i class="fas fa-camera"></i></div>
            <input type="file" id="fileUpload" accept="image/*" onchange="uploadImage()">
        </div>
        <div class="profile-info">
            <h3 id="userName">Loading...</h3>
            <div class="profile-details">
                UID: <span class="uid-badge" id="uidDisplay">...</span><br>
                Joined: <span id="joinDate">...</span>
            </div>
        </div>
    </div>

    <!-- TARGET SELECTORS -->
    <div class="target-grid">
        <div class="target-btn" id="btnMonthly" onclick="goToTarget('monthly')">
            <i class="fas fa-calendar-alt"></i>
            <div class="target-label">Monthly Target</div>
            <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 5px;">Big Rewards</div>
        </div>
        <div class="target-btn" id="btnWeekly" onclick="goToTarget('weekly')">
            <div class="credit-badge" id="creditCount">0 Cr</div>
            <i class="fas fa-calendar-week"></i>
            <div class="target-label">Weekly Target</div>
            <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 5px;">Quick Earnings</div>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div class="grid-menu">
        <div class="menu-item" onclick="window.location.href='balance.html'"><i class="fas fa-wallet"></i><span>My Wallet</span></div>
        <div class="menu-item" onclick="window.location.href='referral.html'"><i class="fas fa-users"></i><span>Referral</span></div>
        <div class="menu-item" onclick="window.location.href='withdraw.html'"><i class="fas fa-hand-holding-usd"></i><span>Withdraw</span></div>
        <div class="menu-item" onclick="window.location.href='task_1.html'"><i class="fas fa-check-circle"></i><span>Daily Task</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUid = null;
        let activePlan = null; // { type: 'monthly'|'weekly', level: 1, endDate: timestamp }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                loadUserData();
            } else {
                window.location.href = "register_login.html";
            }
        });

        function loadUserData() {
            onValue(ref(db, 'users/' + currentUid), (snapshot) => {
                const data = snapshot.val();
                if(!data) return;

                // 1. Profile Data
                document.getElementById('userName').innerText = data.name || "User";
                document.getElementById('uidDisplay').innerText = currentUid.substring(0, 6);
                document.getElementById('joinDate').innerText = data.joiningDate || new Date().toLocaleDateString();
                if(data.profilePic) document.getElementById('profilePic').src = data.profilePic;

                // 2. Credits
                const credits = data.weeklyCredits || 0;
                document.getElementById('creditCount').innerText = `${credits} Cr`;

                // 3. Plan Logic
                activePlan = data.currentPlan || null;
                updateButtons(activePlan);
            });
        }

        function updateButtons(plan) {
            const btnMonthly = document.getElementById('btnMonthly');
            const btnWeekly = document.getElementById('btnWeekly');

            // Reset
            btnMonthly.classList.remove('active', 'disabled');
            btnWeekly.classList.remove('active', 'disabled');

            if (plan && plan.status === 'active') {
                const now = Date.now();
                if (now < plan.endTime) {
                    if (plan.type === 'monthly') {
                        btnMonthly.classList.add('active');
                        btnWeekly.classList.add('disabled');
                    } else if (plan.type === 'weekly') {
                        btnWeekly.classList.add('active');
                        btnMonthly.classList.add('disabled');
                    }
                } else {
                    // Plan expired, allow both
                    update(ref(db, 'users/' + currentUid + '/currentPlan'), { status: 'expired' });
                }
            }
        }

        window.goToTarget = (type) => {
            const btn = type === 'monthly' ? document.getElementById('btnMonthly') : document.getElementById('btnWeekly');
            if(btn.classList.contains('disabled')) return alert(`You already have an active ${type === 'monthly' ? 'Weekly' : 'Monthly'} plan!`);
            
            window.location.href = type + '.html';
        }

        // Simple Base64 Image Upload
        window.uploadImage = () => {
            const file = document.getElementById('fileUpload').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64 = reader.result;
                update(ref(db, 'users/' + currentUid), { profilePic: base64 })
                    .then(() => alert("Profile updated!"));
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
