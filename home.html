<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* PREMIUM DESIGN - Dark & Gold Theme */
        :root { --bg-dark: #0a0a0a; --card-bg: rgba(20, 20, 20, 0.6); --gold: #FFD700; --gold-glow: rgba(255, 215, 0, 0.3); --text-main: #ffffff; }
        body { margin: 0; padding: 20px; background: radial-gradient(circle at top right, #1a1a2e, #000000); color: var(--text-main); font-family: 'Poppins', sans-serif; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-shadow: 0 0 10px var(--gold-glow); }
        .user-badge { background: rgba(255, 255, 255, 0.08); padding: 8px 15px; border-radius: 50px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); }
        .balance-card { background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(0,0,0,0.8)); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px -10px var(--gold-glow); backdrop-filter: blur(10px); }
        .balance-amount { font-size: 2.5rem; font-weight: 700; margin: 10px 0; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); border-color: var(--gold); }
        .menu-item i { font-size: 1.8rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .menu-item span { font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TASK<span style="color:#fff">28</span></div>
        <div class="user-badge" id="userName">User</div>
    </div>

    <div class="balance-card">
        <div style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">TOTAL BALANCE</div>
        <div class="balance-amount" id="displayBalance">0 TK</div>
    </div>

    <!-- MENU GRID -->
    <div class="grid-menu">
        <div class="menu-item" onclick="window.location.href='balance.html'">
            <i class="fas fa-wallet"></i>
            <span>My Balance</span>
        </div>
        <div class="menu-item" onclick="window.location.href='referral.html'">
            <i class="fas fa-users"></i>
            <span>Referral</span>
        </div>
        <div class="menu-item" onclick="window.location.href='withdraw.html'">
            <i class="fas fa-hand-holding-usd"></i>
            <span>Withdraw</span>
        </div>
        <div class="menu-item" onclick="window.location.href='task_1.html'">
            <i class="fas fa-check-circle"></i>
            <span>Task 1</span>
        </div>
        
        <!-- CHANGED: Task 2 Removed, Monthly Salary Added -->
        <div class="menu-item" onclick="window.location.href='monthly.html'">
            <i class="fas fa-calendar-alt"></i>
            <span>Monthly Salary</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('userName').innerText = data.name || "User";
                        document.getElementById('displayBalance').innerText = (data.balance || 0) + " TK";
                    }
                });
            } else { window.location.href = "register_login.html"; }
        });
    </script>
</body>
</html>
