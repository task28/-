<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 1 - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* PREMIUM DARK THEME */
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffd700; margin-top: 0; text-transform: uppercase; margin-bottom: 20px;}
        
        /* NOTICE BOX STYLE */
        .notice-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 10px; padding: 15px; margin-bottom: 25px; }
        .notice-item { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 0.85rem; line-height: 1.4; }
        .notice-icon { width: 25px; color: #00d2ff; margin-right: 5px; text-align: center; }
        .notice-warning { color: #ff4444; }

        /* REJECTION ALERT BOX */
        .reject-box { 
            background: rgba(255, 0, 0, 0.15); border: 1px solid #ff4444; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; display: none; 
        }
        .reject-title { color: #ff4444; font-weight: bold; font-size: 1.1rem; }
        .tutorial-link { 
            display: inline-block; background: #c4302b; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px;
        }

        /* STATUS BOX */
        .status-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* DATA DISPLAY GROUP */
        .data-group { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #ffd700; }
        .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .data-val { color: #fff; font-family: monospace; font-size: 0.95rem; width: 60%; word-break: break-all; text-align: right; }
        
        .btn-copy { background: transparent; border: 1px solid #ffd700; color: #ffd700; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .input-box { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid #555; color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        .main-btn { width: 100%; padding: 14px; background: linear-gradient(45deg, #ffd700, #ff8c00); border: none; font-weight: bold; cursor: pointer; border-radius: 8px; color: #000; font-size: 1rem; }
        
        .timer-display { font-size: 1.5rem; color: #ff4444; text-align: center; margin: 15px 0; font-weight: bold; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gmail Task</h2>

        <!-- REJECTION BOX -->
        <div id="rejectAlert" class="reject-box">
            <div class="reject-title"><i class="fas fa-times-circle"></i> Task Rejected</div>
            <div id="rejectReasonText" style="color:#fff; margin:5px 0;">Reason: ...</div>
            
            <div id="tutorialSection" style="display:none;">
                <p style="font-size:0.85rem; color:#aaa;">You failed multiple times. Watch tutorial:</p>
                <a href="https://youtu.be/YOUR_VIDEO_LINK" target="_blank" class="tutorial-link"><i class="fab fa-youtube"></i> Watch Tutorial</a>
            </div>
            <button class="main-btn" style="margin-top:10px; font-size:0.8rem; padding:8px;" onclick="closeRejectBox()">Try Again</button>
        </div>

        <div class="notice-box">
            <div class="notice-item"><div class="notice-icon"><i class="fas fa-bullhorn"></i></div><div>Request Time: 12:00 PM - 10:00 PM</div></div>
            <div class="notice-item"><div class="notice-icon"><i class="fas fa-exclamation-triangle notice-warning"></i></div><div class="notice-warning">Fake info will block account.</div></div>
        </div>
        
        <div id="statusArea" class="status-box">Checking...</div>

        <!-- IDLE / APPLY -->
        <div id="idleSection" style="display:none;">
            <div id="applyBox"><button id="btnApply" class="main-btn" onclick="applyForTask()">APPLY FOR TASK</button></div>
        </div>

        <!-- WAITING -->
        <div id="waitingSection" style="display:none; text-align:center;">
            <h3>Request Pending</h3>
            <div style="font-size: 2rem; color: #00d2ff; margin: 10px;"><i class="fas fa-satellite-dish fa-spin"></i></div>
            <div id="waitTimerDisplay" style="font-size:1.5rem; color:#00d2ff;">05:00</div>
        </div>

        <!-- SUBMIT -->
        <div id="submitSection" style="display:none;">
            <h3>Task Details</h3>
            <div id="taskDataContainer" class="data-group"></div>
            <div class="input-box"><input type="text" id="subEmail" placeholder="Created Gmail"></div>
            <div class="input-box"><input type="text" id="subPass" placeholder="Password"></div>
            <button class="main-btn" onclick="submitTask()">SUBMIT TASK</button>
        </div>

        <!-- REVIEW -->
        <div id="reviewSection" style="display:none; text-align:center;">
            <h3>Under Review</h3>
            <div style="font-size: 3rem; color: #ffd700; margin: 20px;"><i class="fas fa-hourglass-half fa-spin"></i></div>
        </div>

        <a href="home.html" class="back-link">Back to Dashboard</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
        
        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let waitInterval = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Run checks in parallel for speed
                checkRejections();
                checkTaskStatus();
            } else { window.location.href = "register_login.html"; }
        });

        function checkRejections() {
            get(ref(db, 'users/' + currentUser.uid)).then((snap) => {
                const data = snap.val();
                if(data && data.lastRejectReason) {
                    document.getElementById('rejectAlert').style.display = 'block';
                    document.getElementById('rejectReasonText').innerText = "Reason: " + data.lastRejectReason;
                    if(data.rejectCount && data.rejectCount >= 3) {
                        document.getElementById('tutorialSection').style.display = 'block';
                    }
                }
            });
        }

        window.closeRejectBox = () => {
            update(ref(db, 'users/' + currentUser.uid), { lastRejectReason: null });
            document.getElementById('rejectAlert').style.display = 'none';
        }

        function checkTaskStatus() {
            onValue(ref(db, 'task_requests/' + currentUser.uid), (snapshot) => {
                const data = snapshot.val();
                const uiStatus = document.getElementById('statusArea');
                
                // Reset Views
                ['idleSection', 'waitingSection', 'submitSection', 'reviewSection'].forEach(id => document.getElementById(id).style.display = 'none');
                if(waitInterval) clearInterval(waitInterval);

                if (!data) {
                    uiStatus.innerText = "Status: Ready to Apply";
                    document.getElementById('idleSection').style.display = 'block';
                } else if (data.status === 'requested') {
                    uiStatus.innerText = "Status: Pending Approval";
                    document.getElementById('waitingSection').style.display = 'block';
                    startWaitTimer(data.timestamp + (5*60*1000));
                } else if (data.status === 'assigned') {
                    uiStatus.innerText = "Status: Task Assigned";
                    document.getElementById('submitSection').style.display = 'block';
                    if(data.adminData) renderTaskData(data.adminData);
                } else if (data.status === 'submitted') {
                    uiStatus.innerText = "Status: Under Review";
                    document.getElementById('reviewSection').style.display = 'block';
                }
            });
        }

        function renderTaskData(adminData) {
            const container = document.getElementById('taskDataContainer');
            container.innerHTML = "";
            const fields = [
                { label: "F.Name", val: adminData.fname },
                { label: "L.Name", val: adminData.lname },
                { label: "Pass", val: adminData.password },
                { label: "Rec.Email", val: adminData.recovery },
                { label: "Email", val: adminData.email }
            ];
            fields.forEach((item, index) => {
                if(item.val) {
                    container.innerHTML += `
                    <div class="data-row">
                        <span class="data-label">${item.label}</span>
                        <span class="data-val" id="copy_${index}">${item.val}</span>
                        <button class="btn-copy" onclick="copyText('copy_${index}')">Copy</button>
                    </div>`;
                }
            });
        }

        window.copyText = (id) => navigator.clipboard.writeText(document.getElementById(id).innerText);

        window.applyForTask = () => {
            document.getElementById('btnApply').innerText = "Processing...";
            set(ref(db, 'task_requests/' + currentUser.uid), {
                status: 'requested',
                userPhone: currentUser.email.split('@')[0], 
                timestamp: Date.now() 
            });
        };

        window.submitTask = () => {
            const email = document.getElementById('subEmail').value;
            const pass = document.getElementById('subPass').value;
            if(!email || !pass) return alert("Fill all fields");
            update(ref(db, 'task_requests/' + currentUser.uid), {
                status: 'submitted',
                submission: { email, password: pass }
            });
        }

        function startWaitTimer(targetTime) {
            const display = document.getElementById("waitTimerDisplay");
            waitInterval = setInterval(() => {
                const now = Date.now();
                const dist = targetTime - now;
                if (dist < 0) {
                    clearInterval(waitInterval);
                    remove(ref(db, 'task_requests/' + currentUser.uid));
                    return;
                }
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }
    </script>
</body>
</html>
