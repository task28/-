<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Wallet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        
        .balance-card { 
            background: linear-gradient(135deg, #1a1a1a, #000); 
            border: 1px solid #FFD700; border-radius: 20px; padding: 30px; 
            text-align: center; margin-bottom: 30px; box-shadow: 0 0 20px rgba(255,215,0,0.2); 
        }
        .bal-title { color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .bal-amount { font-size: 3rem; font-weight: 700; color: #fff; margin: 10px 0; }
        .currency { color: #FFD700; font-size: 1.5rem; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-val { font-size: 1.5rem; color: #FFD700; font-weight: bold; }
        .stat-lbl { font-size: 0.8rem; color: #aaa; }

        .history-list { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; }
        .list-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 0; }
        .status-pending { color: orange; }
        .status-rejected { color: red; }
        
        .back-btn { color: #888; text-decoration: none; display: block; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="balance-card">
        <div class="bal-title">Total Balance</div>
        <div class="bal-amount" id="totalBal">0.00 <span class="currency">USDT</span></div>
        <div style="font-size:0.8rem; color:#666;">Converted from Task/Ref Earnings</div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-val" id="monthlyEarn">0</div>
            <div class="stat-lbl">Monthly Earn</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="weeklyEarn">0</div>
            <div class="stat-lbl">Weekly Earn</div>
        </div>
    </div>

    <h3 style="color:#FFD700; margin-bottom:10px;">Pending / Rejected</h3>
    <div class="history-list" id="pendingList">
        <div style="text-align:center; opacity:0.5; padding:10px;">Loading...</div>
    </div>

    <a href="home.html" class="back-btn">Back to Dashboard</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const USDT_RATE = 115; // Used to convert stored TK to USDT for display

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 1. Fetch User Balance & Breakdown
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    const data = snap.val();
                    const tkBalance = data.balance || 0;
                    
                    // Convert TK to USDT
                    const usdtBalance = (tkBalance / USDT_RATE).toFixed(2);
                    document.getElementById('totalBal').innerHTML = `${usdtBalance} <span class="currency">USDT</span>`;

                    // Earnings Breakdown (Assuming you store these separately in DB, otherwise 0)
                    const mEarn = data.earnings ? (data.earnings.monthly || 0) : 0;
                    const wEarn = data.earnings ? (data.earnings.weekly || 0) : 0;
                    
                    document.getElementById('monthlyEarn').innerText = `$${(mEarn/USDT_RATE).toFixed(2)}`;
                    document.getElementById('weeklyEarn').innerText = `$${(wEarn/USDT_RATE).toFixed(2)}`;
                });

                // 2. Fetch Pending/Rejected Withdrawals
                onValue(ref(db, 'withdrawals'), (snap) => {
                    const list = document.getElementById('pendingList');
                    list.innerHTML = "";
                    let hasItems = false;

                    snap.forEach(child => {
                        const w = child.val();
                        if (w.uid === user.uid && (w.status === 'pending' || w.status === 'rejected')) {
                            hasItems = true;
                            const colorClass = w.status === 'pending' ? 'status-pending' : 'status-rejected';
                            list.innerHTML += `
                            <div class="list-item">
                                <div>
                                    <div style="font-weight:bold;">${w.method.toUpperCase()}</div>
                                    <div style="font-size:0.75rem; opacity:0.6;">${new Date(w.timestamp).toLocaleDateString()}</div>
                                </div>
                                <div style="text-align:right;">
                                    <div>${w.amount} TK</div>
                                    <div class="${colorClass}" style="font-size:0.75rem; font-weight:bold;">${w.status.toUpperCase()}</div>
                                </div>
                            </div>`;
                        }
                    });

                    if(!hasItems) list.innerHTML = "<div style='text-align:center; opacity:0.5; padding:10px;'>No pending or rejected requests.</div>";
                });
            }
        });
    </script>
</body>
</html>
