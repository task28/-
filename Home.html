<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Dashboard</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU",
            authDomain: "task38-f7daa.firebaseapp.com",
            databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com",
            projectId: "task38-f7daa",
            storageBucket: "task38-f7daa.firebasestorage.app",
            messagingSenderId: "655282407518",
            appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505; color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 80px; overflow-x: hidden;
        }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 10%, #d4af37 0%, transparent 40%);
            opacity: 0.1; pointer-events: none; z-index: -1;
        }

        /* HEADER */
        .header {
            background: rgba(20, 20, 20, 0.95);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        
        .avatar {
            width: 55px; height: 55px;
            background: linear-gradient(45deg, #d4af37, #b8860b);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; color: #000; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .user-text { flex: 1; }
        .user-text h3 { font-size: 1rem; font-weight: 700; color: #d4af37; margin-bottom: 3px; }
        .user-text p { font-size: 0.8rem; color: #aaa; }

        /* PROFILE CARD */
        .profile-card {
            margin: 20px; padding: 20px;
            background: #111; border-radius: 15px; border: 1px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .profile-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #222;
        }
        .profile-row:last-child { border-bottom: none; }
        
        .p-label { color: #888; font-size: 0.85rem; }
        .p-value { font-family: monospace; font-size: 0.95rem; color: #fff; cursor: pointer; transition: 0.3s; }
        .blur-effect { filter: blur(4px); user-select: none; }
        .p-value:hover { color: #d4af37; filter: blur(0); }

        /* LIVE BALANCE & CREDITS */
        .balance-section {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 20px 20px;
        }
        .bal-box {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            padding: 15px; border-radius: 12px; border: 1px solid #d4af37; text-align: center;
        }
        .bal-title { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
        .bal-num { font-size: 1.2rem; font-weight: 800; color: #fff; margin-top: 5px; font-family: 'Orbitron', sans-serif; }

        /* STATS GRID */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px;
        }
        .stat-box {
            background: #111; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333;
        }
        .stat-title { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .stat-val { font-size: 1.1rem; font-weight: bold; color: #d4af37; margin-top: 5px; }

        /* BANNER */
        .banner-container {
            width: calc(100% - 40px); margin: 0 auto 20px;
            aspect-ratio: 16/9; background: #1a1a1a;
            border-radius: 12px; border: 1px solid #333;
            display: flex; justify-content: center; align-items: center;
            color: #444; font-weight: bold; overflow: hidden;
        }

        /* MENU */
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px;
        }
        .menu-btn {
            background: #111; padding: 20px; border-radius: 12px;
            text-align: center; text-decoration: none; color: white; border: 1px solid #333;
            transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .menu-btn i { font-size: 1.8rem; color: #d4af37; }
        .menu-btn span { font-weight: 600; font-size: 0.85rem; }
        .menu-btn:hover { background: #d4af37; color: #000; }
        .menu-btn:hover i { color: #000; }

        .logout-btn {
            display: block; width: calc(100% - 40px); margin: 30px auto;
            padding: 15px; background: #a31515; color: white;
            border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    
    <div class="bg-glow"></div>

    <div class="header">
        <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
        <div class="user-text">
            <h3 id="u_name">Loading...</h3>
            <p>Plan: <span id="u_plan" style="color:#d4af37">...</span></p>
        </div>
    </div>

    <!-- Balance & Credits -->
    <div class="balance-section">
        <div class="bal-box">
            <div class="bal-title">WALLET BALANCE</div>
            <div class="bal-num">$<span id="u_balance">0.00</span></div>
        </div>
        <div class="bal-box">
            <div class="bal-title">AVAILABLE CREDITS</div>
            <div class="bal-num"><span id="u_credits">0</span> Cr</div>
        </div>
    </div>

    <div class="profile-card">
        <div class="profile-row">
            <span class="p-label">Registered</span>
            <span class="p-value blur-effect" onclick="this.classList.toggle('blur-effect')" id="u_date">...</span>
        </div>
        <div class="profile-row">
            <span class="p-label">User UID</span>
            <span class="p-value blur-effect" onclick="this.classList.toggle('blur-effect')" id="u_uid">...</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-title">Team</div>
            <div class="stat-val" id="u_team">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Partners</div>
            <div class="stat-val" id="u_partner">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Total Earned</div>
            <div class="stat-val" style="color:#2ecc71;">$<span id="u_total">0.00</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Today Earned</div>
            <div class="stat-val" style="color:#2ecc71;">$<span id="u_today">0.00</span></div>
        </div>
    </div>

    <div class="banner-container">
        <div style="text-align:center;">
            <i class="fas fa-ad" style="font-size:2rem; margin-bottom:10px;"></i><br>
            PREMIUM BANNER
        </div>
    </div>

    <div class="menu-grid">
        <a href="Task.html" class="menu-btn"><i class="fas fa-tasks"></i><span>TASK</span></a>
        <a href="Referral.html" class="menu-btn"><i class="fas fa-share-alt"></i><span>REFERRAL</span></a>
        <a href="Monthly.html" class="menu-btn"><i class="fas fa-calendar-alt"></i><span>MONTHLY</span></a>
        <a href="Weekly.html" class="menu-btn"><i class="fas fa-calendar-week"></i><span>WEEKLY</span></a>
        <a href="Withdraw.html" class="menu-btn" style="grid-column: span 2; background: linear-gradient(45deg, #111, #222);">
            <i class="fas fa-wallet" style="color: #fff;"></i><span style="color:#d4af37;">WITHDRAW FUNDS</span>
        </a>
    </div>

    <button class="logout-btn" onclick="auth.signOut()">LOGOUT</button>

    <script>
        auth.onAuthStateChanged((user) => {
            if (user) {
                const uid = user.uid;
                
                db.ref('users/' + uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    
                    if(data) {
                        if(data.isBanned === true) {
                            alert("ACCOUNT SUSPENDED!");
                            auth.signOut(); return;
                        }

                        // Update fields directly
                        document.getElementById('u_name').innerText = data.name;
                        document.getElementById('u_plan').innerText = (data.plan || "Free").toUpperCase();
                        
                        document.getElementById('u_balance').innerText = parseFloat(data.balance || 0).toFixed(2);
                        document.getElementById('u_credits').innerText = data.credits || 0;

                        document.getElementById('u_date').innerText = data.regDate;
                        document.getElementById('u_uid').innerText = data.uid;
                        
                        document.getElementById('u_team').innerText = data.teamCount || 0;
                        document.getElementById('u_partner').innerText = data.partnerCount || 0;
                        
                        document.getElementById('u_total').innerText = parseFloat(data.totalProfit || 0).toFixed(2);
                        document.getElementById('u_today').innerText = parseFloat(data.todayProfit || 0).toFixed(2);
                    }
                });

            } else {
                window.location.href = 'Login.html';
            }
        });
    </script>
</body>
</html>
