<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505; color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 90px; overflow-x: hidden;
        }

        /* Gold Glow Background */
        .bg-glow {
            position: fixed; top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
        }

        /* HEADER */
        .header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 10, 10, 0.95);
            position: sticky; top: 0; z-index: 100;
        }
        .user-info h2 { font-size: 1.2rem; font-weight: 800; color: #fff; text-transform: uppercase; }
        .user-info p { font-size: 0.75rem; color: #888; letter-spacing: 1px; margin-top: 2px; }
        .user-info span { color: #d4af37; font-weight: bold; }
        
        .avatar {
            width: 40px; height: 40px;
            background: #d4af37; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; color: #000;
        }

        /* CREDIT & BALANCE BAR (Updated like Screenshot) */
        .wallet-bar {
            margin: 10px 20px 20px;
            background: #111; border: 1px solid #333;
            border-radius: 50px; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .wb-left { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #d4af37; }
        .wb-left i { font-size: 1rem; }
        
        .buy-btn {
            background: #d4af37; color: #000; border: none; 
            padding: 4px 12px; border-radius: 20px; 
            font-size: 0.7rem; font-weight: 800; cursor: pointer; text-decoration: none;
        }

        .wb-right { text-align: right; }
        .wb-label { font-size: 0.6rem; color: #666; display: block; }
        .wb-balance { font-size: 0.9rem; font-weight: bold; color: #fff; font-family: 'Orbitron'; }

        /* STATS GRID (4 Boxes) */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding: 0 20px; margin-bottom: 25px;
        }
        .stat-box {
            background: #0f0f0f; border: 1px solid #222;
            padding: 15px; border-radius: 12px; text-align: center;
        }
        .stat-val { font-family: 'Orbitron'; font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .stat-lbl { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }

        /* COLORS FOR VALUES */
        .val-profit { color: #2ecc71; } /* Green for Today */
        .val-life { color: #d4af37; }   /* Gold for Lifetime */

        /* BANNER SLIDER */
        .banner-box {
            width: calc(100% - 40px); margin: 0 auto 25px;
            aspect-ratio: 16/7; background: #1a1a1a;
            border-radius: 15px; overflow: hidden;
            border: 1px solid #333; position: relative;
        }
        .banner-box img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; }
        
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            padding: 10px; cursor: pointer; font-size: 1.2rem; z-index: 10;
        }
        .prev-btn { left: 0; }
        .next-btn { right: 0; }

        /* MENU GRID */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; margin-bottom: 30px; }
        .menu-item {
            background: #111; border: 1px solid #222;
            border-radius: 15px; padding: 25px 15px; text-align: center; text-decoration: none;
            color: #fff; transition: 0.2s;
        }
        .menu-item:hover { border-color: #d4af37; background: #161616; }
        .menu-item i { font-size: 1.5rem; color: #d4af37; margin-bottom: 12px; display: block; }
        .menu-item span { font-size: 0.8rem; font-weight: 600; }

        /* LOGOUT */
        .logout-btn {
            display: block; width: calc(100% - 40px); margin: 0 auto;
            padding: 15px; background: rgba(180, 20, 20, 0.1); color: #e74c3c;
            border: 1px solid #e74c3c; border-radius: 10px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 0.8rem;
        }

        .footer-info { text-align: center; color: #444; font-size: 0.7rem; margin-bottom: 15px; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="user-info">
            <h2 id="u_name">...</h2>
            <p>PLAN: <span id="u_plan">FREE</span></p>
        </div>
        <div class="avatar"><i class="fas fa-user"></i></div>
    </div>

    <!-- WALLET BAR (Like Screenshot) -->
    <div class="wallet-bar">
        <div class="wb-left">
            <i class="fas fa-coins"></i> 
            <span style="margin-right:8px;"><span id="u_credits">0</span> Credits</span>
            <a href="Credit_buy.html" class="buy-btn">+ BUY</a>
        </div>
        <div class="wb-right">
            <span class="wb-label">REAL BALANCE</span>
            <span class="wb-balance">$<span id="u_balance">0.00</span></span>
        </div>
    </div>

    <!-- 4 STATS BOXES -->
    <div class="stats-grid">
        <!-- TOTAL TEAM (Recursive Downline) -->
        <div class="stat-box">
            <div class="stat-val" id="u_team">0</div>
            <div class="stat-lbl">Total Team</div>
        </div>

        <!-- MY PARTNERS (Direct Referrals) -->
        <div class="stat-box">
            <div class="stat-val" id="u_partner">0</div>
            <div class="stat-lbl">My Partners</div>
        </div>

        <!-- TODAY'S PROFIT -->
        <div class="stat-box">
            <div class="stat-val val-profit">$<span id="u_today">0.00</span></div>
            <div class="stat-lbl">Today's Profit</div>
        </div>

        <!-- LIFETIME EARN -->
        <div class="stat-box">
            <div class="stat-val val-life">$<span id="u_lifetime">0.00</span></div>
            <div class="stat-lbl">Lifetime Earn</div>
        </div>
    </div>

    <!-- BANNER SLIDER -->
    <div class="banner-box">
        <button class="slider-btn prev-btn" onclick="changeBanner(-1)">&#10094;</button>
        <img id="bannerImg" src="https://via.placeholder.com/600x300/111/333?text=Loading+Ad..." style="display: block;">
        <button class="slider-btn next-btn" onclick="changeBanner(1)">&#10095;</button>
    </div>

    <!-- MAIN MENU -->
    <div class="grid-menu">
        <a href="Task.html" class="menu-item">
            <i class="fas fa-tasks"></i>
            <span>Daily Task</span>
        </a>
        <a href="Referral.html" class="menu-item">
            <i class="fas fa-share-alt"></i>
            <span>Refer & Earn</span>
        </a>
        <a href="Monthly.html" class="menu-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Monthly Plan</span>
        </a>
        <a href="Weekly.html" class="menu-item">
            <i class="fas fa-calendar-week"></i>
            <span>Weekly Plan</span>
        </a>
        <a href="Work_Video.html" class="menu-item">
            <i class="fas fa-play-circle" style="color: #e74c3c;"></i>
            <span>Work Video</span>
        </a>
        <a href="Withdraw.html" class="menu-item">
            <i class="fas fa-wallet" style="color: #fff;"></i>
            <span>WITHDRAW</span>
        </a>
    </div>

    <div class="footer-info">
        UID: <span id="u_uid">...</span> | Join: <span id="u_date">...</span>
    </div>

    <button class="logout-btn" onclick="auth.signOut()">LOGOUT ACCOUNT</button>

    <script>
        // --- BANNER LOGIC ---
        let bannerImages = [];
        let currentIndex = 0;
        let slideInterval;

        db.ref('adminSettings/banners').on('value', snap => {
            bannerImages = [];
            if(snap.exists()) {
                snap.forEach(c => bannerImages.push(c.val()));
                showBanner(0);
                startAutoSlide();
            }
        });

        function showBanner(index) {
            if(bannerImages.length === 0) return;
            if(index >= bannerImages.length) currentIndex = 0;
            else if(index < 0) currentIndex = bannerImages.length - 1;
            else currentIndex = index;
            document.getElementById('bannerImg').src = bannerImages[currentIndex];
        }

        function changeBanner(dir) {
            clearInterval(slideInterval);
            showBanner(currentIndex + dir);
            startAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(() => { showBanner(currentIndex + 1); }, 5000);
        }

        // --- USER DATA LOGIC ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                const uid = user.uid;
                
                db.ref('users/' + uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        if(data.isBanned) { alert("ACCOUNT BANNED"); auth.signOut(); return; }

                        // 1. Basic Info
                        document.getElementById('u_name').innerText = data.name;
                        document.getElementById('u_plan').innerText = (data.plan || "Free").toUpperCase();
                        document.getElementById('u_credits').innerText = data.credits || 0;
                        document.getElementById('u_date').innerText = data.regDate;
                        document.getElementById('u_uid').innerText = uid.substring(0,8);

                        // 2. Real Balance (Current spendable balance)
                        document.getElementById('u_balance').innerText = parseFloat(data.balance || 0).toFixed(2);

                        // 3. Lifetime Earn (All time earnings)
                        document.getElementById('u_lifetime').innerText = parseFloat(data.totalEarnings || 0).toFixed(2);

                        // 4. Today's Profit (Date Logic)
                        // Checks if lastProfitDate equals TODAY's date
                        const todayStr = new Date().toLocaleDateString('en-CA'); // Format: YYYY-MM-DD
                        if(data.lastProfitDate === todayStr) {
                            document.getElementById('u_today').innerText = parseFloat(data.todayProfit || 0).toFixed(2);
                        } else {
                            // If date changed, show 0.00 (New day)
                            document.getElementById('u_today').innerText = "0.00";
                        }

                        // 5. Total Team (Recursive Count)
                        // This assumes your Registration/Referral system updates 'teamCount' in DB
                        document.getElementById('u_team').innerText = data.teamCount || 0;

                        // 6. My Partners (Direct Referrals - Realtime Count)
                        const myCode = data.myRefCode;
                        if(myCode) {
                            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (partnerSnap) => {
                                document.getElementById('u_partner').innerText = partnerSnap.numChildren();
                            });
                        }
                    }
                });
            } else {
                window.location.href = 'registration_login.html';
            }
        });
    </script>
</body>
</html>
