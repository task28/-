    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505; color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 90px; overflow-x: hidden;
        }

        /* Gold Glow Background */
        .bg-glow {
            position: fixed; top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
        }

        /* HEADER */
        .header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info h2 { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .user-info p { font-size: 0.8rem; color: #d4af37; letter-spacing: 1px; }
        
        .avatar {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* WALLET CARD */
        .wallet-card {
            margin: 20px; background: linear-gradient(160deg, #1a1a1a 0%, #000 100%);
            border-radius: 20px; padding: 25px; position: relative; overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wallet-card::before {
            content: ''; position: absolute; top: -50px; right: -50px;
            width: 150px; height: 150px; background: rgba(212, 175, 55, 0.1);
            border-radius: 50%; filter: blur(40px);
        }

        .w-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .w-balance { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: #fff; margin: 5px 0 15px; font-weight: 700; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        
        .w-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .cr-box { display: flex; align-items: center; gap: 8px; }
        .cr-val { font-weight: 700; color: #d4af37; font-size: 1.1rem; }

        /* BUY BUTTON */
        .buy-btn {
            background: #d4af37; color: #000; border: none; padding: 5px 12px;
            border-radius: 20px; font-size: 0.7rem; font-weight: bold; cursor: pointer;
            margin-left: 10px; display: inline-flex; align-items: center; gap: 5px;
            text-decoration: none;
        }
        .buy-btn:hover { background: #fff; }

        /* BANNER SLIDER */
        .banner-box {
            width: calc(100% - 40px); margin: 0 auto 20px;
            aspect-ratio: 16/7; background: #1a1a1a;
            border-radius: 15px; overflow: hidden;
            border: 1px solid #333; position: relative;
        }
        .banner-box img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s ease; }
        
        /* Slider Controls */
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            padding: 10px; cursor: pointer; font-size: 1.2rem; z-index: 10;
        }
        .slider-btn:hover { background: rgba(212, 175, 55, 0.8); color: #000; }
        .prev-btn { left: 0; border-radius: 0 5px 5px 0; }
        .next-btn { right: 0; border-radius: 5px 0 0 5px; }

        .banner-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #444; font-weight: bold; text-align: center; display: none;
        }

        /* MENU GRID */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; margin-bottom: 20px; }
        .menu-item {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px; padding: 20px; text-align: center; text-decoration: none;
            color: #fff; transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        .menu-item:hover { background: rgba(212, 175, 55, 0.1); border-color: #d4af37; transform: translateY(-3px); }
        .menu-item i { font-size: 1.8rem; color: #d4af37; margin-bottom: 10px; }
        .menu-item span { display: block; font-size: 0.85rem; font-weight: 600; }

        /* STATS BAR */
        .stats-bar {
            display: flex; justify-content: space-between; margin: 0 20px 20px;
            background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222;
        }
        .stat { text-align: center; width: 33%; position: relative; }
        .stat:not(:last-child)::after { content: ''; position: absolute; right: 0; top: 10%; height: 80%; width: 1px; background: #333; }
        .stat h4 { font-size: 1rem; color: #fff; margin-bottom: 2px; }
        .stat p { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* LOGOUT */
        .logout-btn {
            display: block; width: calc(100% - 40px); margin: 0 auto;
            padding: 15px; background: rgba(255, 0, 0, 0.1); color: #ff4d4d;
            border: 1px solid #ff4d4d; border-radius: 12px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: 0.3s;
        }
        .logout-btn:hover { background: #ff4d4d; color: #fff; }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="user-info">
            <h2 id="u_name">Loading...</h2>
            <p>PLAN: <span id="u_plan">...</span></p>
        </div>
        <div class="avatar"><i class="fas fa-user"></i></div>
    </div>

    <!-- PREMIUM WALLET CARD -->
    <div class="wallet-card">
        <div class="w-label">Total Balance</div>
        <div class="w-balance">$<span id="u_balance">0.00</span></div>
        
        <div class="w-footer">
            <div class="cr-box">
                <i class="fas fa-coins" style="color: #d4af37;"></i>
                <span class="cr-val"><span id="u_credits">0</span> Credits</span>
                
                <!-- BUY CREDIT OPTION -->
                <a href="Credit_buy.html" class="buy-btn">
                    <i class="fas fa-plus"></i> BUY
                </a>
            </div>
            <div class="w-label" style="font-size: 0.7rem;">TASK28 WALLET</div>
        </div>
    </div>

    <!-- QUICK STATS -->
    <div class="stats-bar">
        <div class="stat">
            <h4 id="u_team">0</h4>
            <p>Team</p>
        </div>
        <div class="stat">
            <h4 id="u_partner">0</h4>
            <p>Partners</p>
        </div>
        <div class="stat">
            <h4 style="color: #2ecc71;">$<span id="u_today">0.00</span></h4>
            <p>Today</p>
        </div>
    </div>

    <!-- BANNER SLIDER -->
    <div class="banner-box">
        <button class="slider-btn prev-btn" onclick="changeBanner(-1)">&#10094;</button>
        <img id="bannerImg" src="" style="display: none;">
        <button class="slider-btn next-btn" onclick="changeBanner(1)">&#10095;</button>
        
        <div class="banner-text" id="bannerPlace">
            <i class="fas fa-crown" style="font-size: 2rem; margin-bottom: 5px;"></i><br>
            PREMIUM ADS AREA
        </div>
    </div>

    <!-- MAIN MENU -->
    <div class="grid-menu">
        <a href="Task.html" class="menu-item">
            <i class="fas fa-tasks"></i>
            <span>Daily Task</span>
        </a>
        <a href="Referral.html" class="menu-item">
            <i class="fas fa-share-alt"></i>
            <span>Refer & Earn</span>
        </a>
        <a href="Monthly.html" class="menu-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Monthly Plan</span>
        </a>
        <a href="Weekly.html" class="menu-item">
            <i class="fas fa-calendar-week"></i>
            <span>Weekly Plan</span>
        </a>

        <!-- WORK VIDEO BUTTON ADDED HERE -->
        <a href="Work_Video.html" class="menu-item">
            <i class="fas fa-play-circle" style="color: #e74c3c;"></i>
            <span>Work Video</span>
        </a>

        <!-- WITHDRAW BUTTON -->
        <a href="Withdraw.html" class="menu-item" style="background: linear-gradient(90deg, #111, #1a1a1a);">
            <i class="fas fa-wallet" style="color: #fff;"></i>
            <span style="color: #d4af37;">WITHDRAW</span>
        </a>
    </div>

    <!-- USER DETAILS -->
    <div style="padding: 0 20px; font-size: 0.8rem; color: #666; margin-bottom: 10px; text-align: center;">
        UID: <span id="u_uid">...</span> | Join: <span id="u_date">...</span>
    </div>

    <button class="logout-btn" onclick="auth.signOut()">LOGOUT ACCOUNT</button>

    <script>
        // --- BANNER SLIDER LOGIC ---
        let bannerImages = [];
        let currentIndex = 0;
        let slideInterval;

        db.ref('adminSettings/banners').on('value', snap => {
            bannerImages = [];
            if(snap.exists()) {
                snap.forEach(c => bannerImages.push(c.val()));
                showBanner(0);
                startAutoSlide();
                document.getElementById('bannerPlace').style.display = 'none';
            } else {
                document.getElementById('bannerImg').style.display = 'none';
                document.getElementById('bannerPlace').style.display = 'block';
            }
        });

        function showBanner(index) {
            if(bannerImages.length === 0) return;
            if(index >= bannerImages.length) currentIndex = 0;
            else if(index < 0) currentIndex = bannerImages.length - 1;
            else currentIndex = index;
            const img = document.getElementById('bannerImg');
            img.style.display = 'block';
            img.src = bannerImages[currentIndex];
        }

        function changeBanner(dir) {
            clearInterval(slideInterval);
            showBanner(currentIndex + dir);
            startAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                showBanner(currentIndex + 1);
            }, 15000);
        }

        // --- USER DATA LOAD ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                const uid = user.uid;
                
                db.ref('users/' + uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        if(data.isBanned === true) {
                            alert("ACCOUNT SUSPENDED!");
                            auth.signOut(); return;
                        }

                        // Basic Info
                        document.getElementById('u_name').innerText = data.name;
                        document.getElementById('u_plan').innerText = (data.plan || "Free").toUpperCase();
                        document.getElementById('u_balance').innerText = parseFloat(data.balance || 0).toFixed(2);
                        document.getElementById('u_credits').innerText = data.credits || 0;
                        document.getElementById('u_date').innerText = data.regDate;
                        document.getElementById('u_uid').innerText = data.uid.substring(0,8) + "...";
                        document.getElementById('u_today').innerText = parseFloat(data.todayProfit || 0).toFixed(2);
                        
                        // Team Count (Total Downline)
                        document.getElementById('u_team').innerText = data.teamCount || 0;

                        // ============================================
                        // PARTNER COUNT FIX (REAL-TIME CALCULATION)
                        // ============================================
                        // যেহেতু আপনার Screenshot এ দেখেছি 'Referral Code' দিয়ে জয়েন হয়।
                        // তাই আমরা 'referralCode' ব্যবহার করে চেক করব কতজন জয়েন করেছে।
                        
                        const myReferralCode = data.referralCode; // আপনার কোড (যেমন: TASK827825)
                        
                        if(myReferralCode) {
                            // 'referredBy' ফিল্ডে আপনার কোড খুঁজবে
                            db.ref('users').orderByChild('referredBy').equalTo(myReferralCode).on('value', (partnerSnap) => {
                                const count = partnerSnap.numChildren();
                                document.getElementById('u_partner').innerText = count;
                            });
                        } else {
                            // যদি কোড না থাকে, তাহলে 0 দেখাবে
                             document.getElementById('u_partner').innerText = 0;
                        }
                    }
                });

            } else {
                window.location.href = 'registration_login.html';
            }
        });
    </script>
</body>
</html>
