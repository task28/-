    <style>
        :root {
            --primary-gold: #ffd700;
            --secondary-gold: #d4af37;
            --accent-cyan: #00d4ff;
            --accent-purple: #a855f7;
            --bg-dark: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 215, 0, 0.2);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Background Mesh */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            filter: blur(80px);
            z-index: -2;
            animation: meshMove 20s ease infinite;
        }

        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Grid Overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        /* Glass Header */
        .header {
            padding: 20px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        
        .user-info h2 { 
            font-size: 1.4rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #fff 0%, var(--secondary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .user-info p { 
            font-size: 0.75rem; 
            color: rgba(255,255,255,0.5); 
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .user-info span { 
            color: var(--primary-gold);
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .avatar {
            width: 50px; 
            height: 50px;
            background: linear-gradient(135deg, var(--primary-gold), #ff6b6b); 
            border-radius: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-size: 1.4rem; 
            color: #000;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .avatar::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }
        
        .avatar:hover { 
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.4);
        }
        
        .avatar:hover::before {
            left: 100%;
        }

        /* Premium Wallet Bar */
        .wallet-bar {
            margin: 24px 20px;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(0,212,255,0.05));
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px; 
            padding: 24px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .wallet-bar::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .wb-left { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-weight: 700; 
            color: var(--primary-gold);
            font-size: 1.2rem;
            z-index: 1;
        }
        
        .buy-btn {
            background: linear-gradient(135deg, var(--primary-gold), var(--secondary-gold)); 
            color: #000;
            border: none;
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 800; 
            cursor: pointer; 
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
        }

        .wb-right { 
            text-align: right;
            z-index: 1;
        }
        
        .wb-label { 
            font-size: 0.65rem; 
            color: rgba(255,255,255,0.4); 
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .wb-balance { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            letter-spacing: -0.5px;
        }

        /* Stats Grid - 3D Cards */
        .stats-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px;
            padding: 0 20px; 
            margin-bottom: 28px;
        }
        
        .stat-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px; 
            padding: 24px 16px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }
        
        .stat-box:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .stat-val { 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: #fff; 
            margin-bottom: 8px;
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
        }
        
        .stat-val::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 2px;
            background: currentColor;
            border-radius: 2px;
            opacity: 0.5;
        }
        
        .stat-lbl { 
            font-size: 0.7rem; 
            color: rgba(255,255,255,0.4); 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;

            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
        .val-life { 
            color: var(--primary-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* Banner - Cinematic */
        .banner-box {
            width: calc(100% - 40px); 
            margin: 0 auto 32px;
            aspect-ratio: 16/7; 
            background: #0f0f0f;
            border-radius: 24px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .banner-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.4));
            pointer-events: none;
        }
        
        .banner-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .banner-box:hover img { 
            transform: scale(1.05); 
        }
        
        .slider-btn {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6); 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.1);
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer; 
            font-size: 1rem;
            z-index: 10;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slider-btn:hover { 
            background: var(--primary-gold);
            color: #000;
            border-color: var(--primary-gold);
            transform: translateY(-50%) scale(1.1);
        }
        
        .prev-btn { left: 16px; }
        .next-btn { right: 16px; }

        /* Menu Grid - Glassmorphism Icons */
        .grid-menu { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
            padding: 0 20px; 
            margin-bottom: 32px; 
        }
        
        .menu-item {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px; 
            padding: 28px 16px; 
            text-align: center; 
            text-decoration: none;
            color: #fff; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,215,0,0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .menu-item:hover { 
            border-color: rgba(255, 215, 0, 0.3); 
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .menu-item:hover::before { 
            opacity: 1; 
        }
        
        .menu-item i { 
            font-size: 2rem; 
            background: linear-gradient(135deg, var(--primary-gold), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        
        .menu-item:hover i { 
            transform: scale(1.2) rotate(5deg);
            filter: drop-shadow(0 8px 12px rgba(255,215,0,0.3));
        }
        
        .menu-item span { 
            font-size: 0.85rem; 
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.9);
        }

        /* Special colors for specific icons */
        .menu-item:nth-child(5) i {
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .menu-item:nth-child(6) i {
            background: linear-gradient(135deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Bottom Actions */
        .bottom-actions {
            padding: 0 20px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-btn-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px; 
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(0,212,255,0.05));
            color: var(--accent-cyan);
            border: 1px solid rgba(0,212,255,0.2); 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer;
            text-transform: uppercase; 
            transition: all 0.3s; 
            font-size: 0.85rem;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .history-btn-block::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .history-btn-block:hover { 
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,212,255,0.1));
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .history-btn-block:hover::before { 
            left: 100%; 
        }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, rgba(239,68,68,0.1), rgba(239,68,68,0.05));
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2); 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer;
            text-transform: uppercase; 
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .logout-btn:hover { 
            background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.1));
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
            transform: translateY(-2px);
        }

        .footer-info { 
            text-align: center; 
            color: rgba(255,255,255,0.25); 
            font-size: 0.75rem; 
            margin-bottom: 20px; 
            margin-top: 16px;
            letter-spacing: 1px;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Loading Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive */
        @media (max-width: 380px) {
            .stats-grid { gap: 12px; }
            .stat-box { padding: 20px 12px; }
            .stat-val { font-size: 1.3rem; }
            .wb-balance { font-size: 1.2rem; }
        }

        /* Pulse animation for live data */
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
        }
        
        .live-update {
            animation: pulse-gold 2s infinite;
        }

        </button>

            <i class="fas fa-sign-out-alt"></i> LOGOUT ACCOUNT
        </button>

    <script>
        // --- BANNER LOGIC ---
        let bannerImages = [];
        let currentIndex = 0;
        let slideInterval;

        // Banner Load Fix: Add empty check
        db.ref('adminSettings/banners').on('value', snap => {
            bannerImages = [];
            if(snap.exists()) {
                const val = snap.val();
                // Handle both array and object formats
                if(Array.isArray(val)) {
                    bannerImages = val.filter(item => item);
                } else {
                    bannerImages = Object.values(val);
                }
                
                if(bannerImages.length > 0) {
                    showBanner(0);
                    startAutoSlide();
                }
            }
        });

        function showBanner(index) {
            if(bannerImages.length === 0) return;
            if(index >= bannerImages.length) currentIndex = 0;
            else if(index < 0) currentIndex = bannerImages.length - 1;
            else currentIndex = index;
            document.getElementById('bannerImg').src = bannerImages[currentIndex];
        }

        function changeBanner(dir) {
            clearInterval(slideInterval);
            showBanner(currentIndex + dir);
            startAutoSlide();
        }

        function startAutoSlide() {
            clearInterval(slideInterval);
            slideInterval = setInterval(() => { showBanner(currentIndex + 1); }, 5000);
        }

        // --- USER DATA LOGIC (ROBUST SYSTEM FIX FOR ID/NAME) ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                const uid = user.uid;
                
                db.ref('users/' + uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    
                    // SYSTEM FIX: Even if data is missing/null, don't crash. Use defaults.
                    const userData = data || {}; 

                    if(userData.status === 'banned' || userData.isBanned) { 
                        alert("ACCOUNT BANNED"); 
                        auth.signOut(); 
                        return; 
                    }

                    // --- FIX: BETTER NAME FETCHING ---
                    // Try DB Name, then Username, then Auth DisplayName, then Email
                    let displayName = userData.name || userData.username || userData.fullName;
                    if(!displayName && user.displayName) displayName = user.displayName;
                    if(!displayName && user.email) displayName = user.email.split('@')[0];
                    if(!displayName) displayName = "User";

                    document.getElementById('u_name').innerText = displayName;
                    
                    // Basic Plan Info
                    document.getElementById('u_plan').innerText = (userData.plan || "Free").toUpperCase();
                    document.getElementById('u_credits').innerText = userData.credits || 0;
                    
                    // --- FIX: BETTER JOIN DATE ---
                    let joinDate = userData.regDate || userData.joinDate || userData.date;
                    // If DB date is missing, use Auth Creation Time
                    if(!joinDate && user.metadata && user.metadata.creationTime) {
                         const d = new Date(user.metadata.creationTime);
                         // Format: YYYY-MM-DD
                         joinDate = d.toISOString().split('T')[0];
                    }
                    document.getElementById('u_date').innerText = joinDate || '--';

                    // --- FIX: UID DISPLAY ---
                    document.getElementById('u_uid').innerText = uid.substring(0,8);

                    // Get Current Values from DOM for Animation Start
                    // Safe parsing to avoid NaN when text is "Loading..."
                    const currentBal = parseFloat(document.getElementById('u_balance').innerText) || 0;
                    const currentLife = parseFloat(document.getElementById('u_lifetime').innerText) || 0;
                    const currentToday = parseFloat(document.getElementById('u_today').innerText) || 0;
                    const currentTeam = parseInt(document.getElementById('u_team').innerText) || 0;

                    // Real Balance
                    animateValue('u_balance', currentBal, parseFloat(userData.balance || 0), 1000);

                    // Lifetime Earn
                    animateValue('u_lifetime', currentLife, parseFloat(userData.totalEarnings || 0), 1000);

                    // Today's Profit Logic
                    const todayStr = new Date().toLocaleDateString('en-CA');
                    const todayProfit = (userData.lastProfitDate === todayStr) ? parseFloat(userData.todayProfit || 0) : 0;
                    animateValue('u_today', currentToday, todayProfit, 1000);

                    // Total Team
                    animateValue('u_team', currentTeam, parseInt(userData.teamCount || 0), 1000);

                    // My Partners
                    const myCode = userData.myRefCode;
                    if(myCode) {
                        db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (partnerSnap) => {
                            const pCount = partnerSnap.exists() ? partnerSnap.numChildren() : 0;
                            const currentPartner = parseInt(document.getElementById('u_partner').innerText) || 0;
                            animateValue('u_partner', currentPartner, pCount, 500);
                        });
                    } else {
                         document.getElementById('u_partner').innerText = 0;
                    }
                });
            } else {
                window.location.href = 'registration_login.html';
            }
        });

        // Number animation function (FIXED: Handles NaN/Loading text)
        function animateValue(id, start, end, duration) {
            // Fix: If start is not a number (e.g. "Loading..."), start from 0
            if (isNaN(start)) start = 0;
            if (isNaN(end)) end = 0;
            
            if (start === end) {
                const obj = document.getElementById(id);
                if(obj) obj.innerText = Number.isInteger(end) ? end : end.toFixed(2);
                return;
            }

            const range = end - start;
            const obj = document.getElementById(id);
            if(!obj) return;

            let current = start;
            const stepTime = 30; // ms
            const steps = duration / stepTime;
            const increment = range / steps;
            
            // If difference is very small, just set it immediately
            if (Math.abs(range) < 0.01) {
                obj.innerText = Number.isInteger(end) ? end : end.toFixed(2);
                return;
            }
            
            const timer = setInterval(function() {
                current += increment;
                
                // Check bounds
                if ((range > 0 && current >= end) || (range < 0 && current <= end)) {
                    current = end;
                    clearInterval(timer);
                }
                
                obj.innerText = Number.isInteger(end) ? Math.floor(current) : current.toFixed(2);
            }, stepTime);
        }
    </script>
