<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Plan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .credit-box { background: linear-gradient(135deg, #FFD700, #ff8c00); color: #000; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .grid-lvls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .wk-card { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 15px; border-radius: 10px; text-align: center; }
        .btn-start { background: transparent; border: 1px solid #FFD700; color: #FFD700; width: 100%; padding: 5px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .btn-start:hover { background: #FFD700; color: #000; }
        .btn-buy { background: #000; color: #FFD700; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10; align-items: center; justify-content: center; }
        .modal-content { background: #222; padding: 25px; border-radius: 15px; border: 1px solid #FFD700; text-align: center; max-width: 300px; }
    </style>
</head>
<body>

    <div class="credit-box">
        <div style="font-size:0.9rem;">Weekly Credits</div>
        <div style="font-size:2.5rem; font-weight:bold;" id="wkScore">0</div>
        <button class="btn-buy" onclick="openPay()">Buy 5 Credits (0.40 USDT)</button>
        <div style="font-size:0.7rem; margin-top:5px;">1 Credit = 1 Week Use</div>
    </div>

    <div id="statusMsg" style="color:red; text-align:center; margin-bottom:10px;"></div>
    <div class="grid-lvls" id="wkContainer"></div>

    <a href="home.html" style="display:block; text-align:center; margin-top:20px; color:#aaa; text-decoration:none;">Back to Dashboard</a>

    <!-- FAKE PAYMENT MODAL -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#FFD700">Buy Weekly Bundle</h3>
            <p>Send 0.40 USDT for 5 Credits.</p>
            <div style="background:#333; padding:10px; font-size:0.7rem; word-break:break-all; border-radius:5px; margin:10px 0;">0xYourWalletHere...</div>
            <button class="btn-buy" style="background:#FFD700; color:#000;" onclick="confirmPay()">Confirm Payment</button>
            <button style="background:transparent; color:#fff; border:none; margin-top:10px;" onclick="closePay()">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const levels = [
            { id: 1, refs: 10, task: 20, reward: 120 },
            { id: 2, refs: 20, task: 40, reward: 240 },
            { id: 3, refs: 30, task: 60, reward: 360 },
            { id: 4, refs: 50, task: 100, reward: 600 },
            { id: 5, refs: 60, task: 120, reward: 720 },
            { id: 6, refs: 70, task: 140, reward: 840 }
        ];

        let uid = null;
        let credits = 0;
        let hasActiveTarget = false;

        onAuthStateChanged(auth, (user) => {
            if(user) {
                uid = user.uid;
                
                // Check Target
                onValue(ref(db, `users/${uid}/target`), (snap) => {
                    const t = snap.val();
                    if(t && (t.status === 'pending' || t.status === 'active')) {
                        hasActiveTarget = true;
                        document.getElementById('statusMsg').innerText = "⚠️ Pending/Active target already exists.";
                    }
                    renderLvls();
                });

                // Check Credits
                onValue(ref(db, `users/${uid}/credits/weekly`), (snap) => {
                    credits = snap.val() || 0;
                    document.getElementById('wkScore').innerText = credits;
                    renderLvls();
                });
            }
        });

        function renderLvls() {
            const cont = document.getElementById('wkContainer');
            cont.innerHTML = "";
            
            levels.forEach(l => {
                let btnTxt = "Apply";
                let disabled = "";
                let style = "";

                if(hasActiveTarget || credits < 1) {
                    btnTxt = "Locked";
                    disabled = "disabled";
                    style = "border-color:#555; color:#555; pointer-events:none;";
                }

                cont.innerHTML += `
                <div class="wk-card">
                    <div style="color:#FFD700; font-weight:bold;">Level ${l.id}</div>
                    <div style="font-size:0.75rem; color:#ccc; margin-bottom:5px;">${l.refs} Ref | ${l.task} Task</div>
                    <div style="font-weight:bold; color:#00e676;">${l.reward} TK</div>
                    <button class="btn-start" style="${style}" ${disabled} onclick="applyWk(${l.id})">${btnTxt}</button>
                </div>`;
            });
        }

        window.openPay = () => document.getElementById('payModal').style.display = 'flex';
        window.closePay = () => document.getElementById('payModal').style.display = 'none';

        window.confirmPay = () => {
            // Simulated Payment -> In real app, Admin adds credit
            update(ref(db, `users/${uid}/credits`), { weekly: credits + 5 });
            alert("Payment Verified! 5 Credits Added.");
            closePay();
        }

        window.applyWk = (id) => {
            if(!confirm(`Use 1 Weekly Credit for Level ${id}? \nWaiting for Admin Approval.`)) return;
            
            const selected = levels.find(l => l.id === id);

            const updates = {};
            updates[`users/${uid}/credits/weekly`] = credits - 1;
            updates[`users/${uid}/target`] = {
                type: 'weekly',
                level: id,
                status: 'pending',
                reqRef: selected.refs,
                reqTask: selected.task,
                currentRef: 0,
                currentTask: 0,
                requestDate: Date.now()
            };

            update(ref(db), updates).then(() => {
                alert("Application Sent! Waiting for Admin.");
                window.location.href = "home.html";
            });
        }
    </script>
</body>
</html>
