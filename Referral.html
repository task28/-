<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer & Earn</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // আপনার রিয়েল কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #fff; 
            font-family: 'Poppins', sans-serif; padding-bottom: 50px;
        }

        /* HEADER */
        .header {
            padding: 20px; background: #16213e;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky; top: 0; z-index: 100;
        }
        .page-title { font-size: 1.1rem; font-weight: 700; }
        .back-btn { font-size: 1.2rem; cursor: pointer; color: #fff; }

        .container { padding: 20px; }

        /* INFO CARD */
        .info-card {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-radius: 15px; padding: 20px;
            border: 1px solid #1f4068; margin-bottom: 20px;
        }
        .info-text { font-size: 0.85rem; color: #e0e0e0; line-height: 1.6; margin-bottom: 15px; }

        /* COPY BOXES */
        .copy-group { margin-bottom: 15px; }
        .copy-label { font-size: 0.75rem; color: #888; margin-bottom: 5px; display: block; }
        .copy-box {
            background: rgba(0,0,0,0.2); border: 1px solid #1f4068;
            border-radius: 8px; padding: 5px 5px 5px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .copy-val { font-family: monospace; color: #00d2ff; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
        .btn-copy {
            background: #00d2ff; color: #000; border: none;
            padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .stat-card {
            background: #1f2a48; border-radius: 12px; padding: 20px 10px;
            text-align: center; border: 1px solid #2a3b55;
        }
        .stat-icon { font-size: 1.5rem; color: #00d2ff; margin-bottom: 10px; }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .stat-lbl { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }

        .full-card {
            grid-column: span 2; background: linear-gradient(45deg, #1f2a48, #2a3b55);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 25px;
        }

        /* TEAM LIST */
        .list-header { font-size: 1rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .partner-item {
            background: #1f2a48; padding: 12px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid #00d2ff;
        }
        .p-name { font-weight: 600; font-size: 0.9rem; color: #fff; }
        .p-date { font-size: 0.7rem; color: #888; margin-top: 2px; }
        
        /* TOAST */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00d2ff; color: #000; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; display: none; z-index: 200;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">Refer & Earn</div>
        <div style="width:20px;"></div>
    </div>

    <div class="container">
        
        <div class="info-card">
            <div class="info-text">
                Earn <b>20% Commission</b> from every task your direct partners complete.
            </div>

            <!-- CODE -->
            <div class="copy-group">
                <span class="copy-label">Your Referral Code</span>
                <div class="copy-box">
                    <span class="copy-val" id="displayCode">...</span>
                    <button class="btn-copy" onclick="copyText('code')">Copy</button>
                </div>
            </div>

            <!-- LINK -->
            <div class="copy-group">
                <span class="copy-label">Your Referral Link</span>
                <div class="copy-box">
                    <span class="copy-val" id="displayLink">...</span>
                    <button class="btn-copy" onclick="copyText('link')">Copy</button>
                </div>
            </div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
            <!-- ডিরেক্ট পার্টনার (মেইন টপিক: ৩১ মেম্বার) -->
            <div class="stat-card">
                <i class="fas fa-user-friends stat-icon"></i>
                <div class="stat-num" id="partnerCount">0</div>
                <div class="stat-lbl">DIRECT PARTNERS</div>
            </div>

            <!-- টোটাল টিম -->
            <div class="stat-card">
                <i class="fas fa-users stat-icon"></i>
                <div class="stat-num" id="teamCount">0</div>
                <div class="stat-lbl">TOTAL TEAM</div>
            </div>

            <!-- মেইন ইনকাম সেকশন (0.81 ডলার) -->
            <div class="stat-card full-card">
                <i class="fas fa-wallet stat-icon" style="font-size:2rem; margin-bottom:5px;"></i>
                <div class="stat-num" style="font-size:1.8rem;">
                    $<span id="totalComm">0.00</span>
                </div>
                <div class="stat-lbl">LIFETIME COMMISSION EARNINGS</div>
            </div>
        </div>

        <!-- LIST -->
        <div class="list-header">
            <i class="fas fa-list"></i> My Team Members
        </div>
        <div id="partnerList">
            <p style="text-align:center; color:#666; font-size:0.8rem; padding:10px;">Checking database...</p>
        </div>

    </div>

    <div class="toast" id="toastMsg">Copied!</div>

    <script>
        const baseURL = "https://task28.github.io/-/registration_login.html"; 

        auth.onAuthStateChanged(user => {
            if(user) {
                // ১. ইউজার ডাটা এবং ইনকাম লোড করা (Real DB Value)
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        // রেফার কোড এবং লিংক
                        const myRefCode = data.myRefCode || "N/A";
                        document.getElementById('displayCode').innerText = myRefCode;
                        document.getElementById('displayLink').innerText = `${baseURL}?ref=${myRefCode}`;

                        // টোটাল টিম সংখ্যা (ডাটাবেস থেকে যা আছে তাই)
                        document.getElementById('teamCount').innerText = data.teamCount || 0;

                        // *** আসল ইনকাম শো করার লজিক (0.81) ***
                        // ডাটাবেসে 'totalCommission' নামে যদি 0.81 থাকে, সেটাই এখানে দেখাবে।
                        let commission = parseFloat(data.totalCommission);
                        
                        // যদি ডাটাবেসে ভ্যালু না থাকে বা ভুল থাকে তবে 0 দেখাবে
                        if(isNaN(commission)) commission = 0;
                        
                        document.getElementById('totalComm').innerText = commission.toFixed(2);

                        // ২. ৩১ জন মেম্বার লোড করা
                        loadMyTeam(myRefCode);
                    }
                });
            } else {
                window.location.href = "registration_login.html";
            }
        });

        function loadMyTeam(code) {
            // ডাটাবেস থেকে ঠিক সেই ইউজারদের আনবে যারা আপনার কোড ব্যবহার করেছে
            db.ref('users').orderByChild('referredBy').equalTo(code).on('value', snap => {
                const list = document.getElementById('partnerList');
                const countElem = document.getElementById('partnerCount'); // Direct Partners Count
                
                list.innerHTML = ""; // আগের লিস্ট ক্লিয়ার
                
                if(snap.exists()) {
                    // মেম্বার সংখ্যা আপডেট (Real Count from DB)
                    const totalMembers = snap.numChildren();
                    countElem.innerText = totalMembers;

                    // লিস্ট বানানো
                    snap.forEach(child => {
                        const u = child.val();
                        const isActive = u.activePlan ? true : false;
                        
                        list.innerHTML += `
                            <div class="partner-item">
                                <div>
                                    <div class="p-name">${u.name || 'Unknown User'}</div>
                                    <div class="p-date">Joined: ${u.regDate || 'N/A'}</div>
                                </div>
                                <div style="font-size:0.7rem; color:${isActive ? '#2ecc71' : '#888'}; font-weight:bold;">
                                    ${isActive ? 'Premium' : 'Free'}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    countElem.innerText = "0";
                    list.innerHTML = "<p style='text-align:center; color:#666; padding:20px;'>No team members found.</p>";
                }
            });
        }

        // কপি ফাংশন
        function copyText(type) {
            let txt = "";
            if(type === 'code') txt = document.getElementById('displayCode').innerText;
            else txt = document.getElementById('displayLink').innerText;

            if(txt !== "..." && txt !== "N/A") {
                navigator.clipboard.writeText(txt);
                const t = document.getElementById('toastMsg');
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 2000);
            }
        }
    </script>
</body>
</html>
