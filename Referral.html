<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Team & Rewards</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* Glow Effect */
        .bg-glow {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: rgba(212, 175, 55, 0.15);
            filter: blur(150px); pointer-events: none; z-index: -1;
        }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .back-btn { font-size: 1.2rem; color: #fff; cursor: pointer; }
        .page-title { font-size: 1.1rem; font-weight: 700; color: #d4af37; letter-spacing: 2px; }

        /* REFERRAL CARD */
        .ref-card {
            margin: 20px;
            background: linear-gradient(135deg, #111, #0a0a0a);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px; padding: 25px;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .ref-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 60%);
            animation: rotate 10s linear infinite; pointer-events: none;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .ref-title { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        
        .code-box {
            background: #000; border: 1px dashed #d4af37;
            padding: 10px; margin: 15px 0; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 2;
        }
        .my-code { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #fff; letter-spacing: 2px; }
        
        .copy-btn {
            background: #d4af37; color: #000; border: none;
            padding: 5px 12px; border-radius: 5px; font-weight: bold; cursor: pointer;
            font-size: 0.8rem; transition: 0.2s;
        }
        .copy-btn:active { transform: scale(0.9); }

        .commission-text { font-size: 0.9rem; color: #ccc; margin-top: 10px; position: relative; z-index: 2; }
        .comm-val { color: #2ecc71; font-weight: bold; }

        /* SECTION HEADERS */
        .section-head {
            margin: 30px 20px 15px;
            display: flex; align-items: center; gap: 10px;
            color: #d4af37; font-weight: 700; font-size: 1rem;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .section-head i { font-size: 1.2rem; }

        /* LEADERBOARD */
        .leaderboard { padding: 0 20px; }
        
        .l-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 12px 15px;
            border-radius: 10px; margin-bottom: 8px;
            border: 1px solid transparent; transition: 0.3s;
        }
        
        .l-rank { font-weight: 800; width: 30px; font-size: 1rem; color: #666; }
        .l-name { flex: 1; font-size: 0.9rem; font-weight: 600; }
        .l-score { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #d4af37; }

        /* Top 3 Styling */
        .l-item:nth-child(1) { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); }
        .l-item:nth-child(1) .l-rank { color: #ffd700; }
        
        .l-item:nth-child(2) { border-color: #c0c0c0; background: rgba(192, 192, 192, 0.1); }
        .l-item:nth-child(2) .l-rank { color: #c0c0c0; }
        
        .l-item:nth-child(3) { border-color: #cd7f32; background: rgba(205, 127, 50, 0.1); }
        .l-item:nth-child(3) .l-rank { color: #cd7f32; }

        /* PARTNERS LIST */
        .partner-list { padding: 0 20px; }
        .p-item {
            background: #111; padding: 15px; border-radius: 10px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid #333;
        }
        .p-item.active { border-left-color: #2ecc71; }
        
        .p-info div:first-child { font-weight: 600; font-size: 0.95rem; color: #fff; }
        .p-info div:last-child { font-size: 0.75rem; color: #666; margin-top: 2px; }
        
        .p-status { text-align: right; }
        .stat-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; background: #222; color: #888; }
        .stat-badge.act { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">TEAM & REWARDS</div>
        <div style="width:20px;"></div>
    </div>

    <!-- REFERRAL CARD -->
    <div class="ref-card">
        <div class="ref-title">Your Referral Code</div>
        <div class="code-box">
            <span class="my-code" id="myCode">...</span>
            <button class="copy-btn" onclick="copyCode()">COPY</button>
        </div>
        <div class="commission-text">
            Today's Commission: <span class="comm-val" id="commDisplay">$0.00</span>
        </div>
        <p style="font-size:0.7rem; color:#666; margin-top:10px;">Earn 20% commission from your team's task earnings.</p>
    </div>

    <!-- LEADERBOARD -->
    <div class="section-head">
        <i class="fas fa-trophy"></i> TOP EARNERS (TODAY)
    </div>
    <div class="leaderboard" id="leaderboardList">
        <div style="text-align:center; color:#444; padding:10px;">Loading Rankings...</div>
    </div>

    <!-- MY TEAM -->
    <div class="section-head">
        <i class="fas fa-users"></i> MY PARTNERS
    </div>
    <div class="partner-list" id="partnerList">
        <div style="text-align:center; color:#444; padding:10px;">Loading Partners...</div>
    </div>

    <script>
        let myRefCode = "";

        auth.onAuthStateChanged(user => {
            if(user) {
                // 1. Get My Data
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        myRefCode = data.myRefCode;
                        document.getElementById('myCode').innerText = myRefCode;
                        document.getElementById('commDisplay').innerText = "$" + parseFloat(data.todayCommission || 0).toFixed(3);
                        
                        // Load Partners
                        loadPartners(myRefCode);
                    }
                });

                // 2. Load Leaderboard
                loadLeaderboard();
            } else {
                window.location.href = "registration_login.html";
            }
        });

        // Copy Function
        function copyCode() {
            const code = document.getElementById('myCode').innerText;
            if(code === "...") return;
            
            // Full Link
            const link = window.location.origin + "/registration_login.html?ref=" + code;
            
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "COPIED!";
                btn.style.background = "#fff";
                setTimeout(() => {
                    btn.innerText = "COPY";
                    btn.style.background = "#d4af37";
                }, 1500);
            });
        }

        // Leaderboard Logic
        function loadLeaderboard() {
            db.ref('users').orderByChild('todayProfit').limitToLast(10).on('value', snap => {
                const list = document.getElementById('leaderboardList');
                list.innerHTML = "";
                let users = [];

                snap.forEach(child => {
                    const u = child.val();
                    if(u.todayProfit > 0) {
                        users.push({ name: u.name, score: parseFloat(u.todayProfit) });
                    }
                });

                // Sort High to Low
                users.sort((a, b) => b.score - a.score);

                if(users.length === 0) {
                    list.innerHTML = "<div style='text-align:center; color:#444; font-size:0.8rem;'>No Data Available Yet</div>";
                    return;
                }

                users.forEach((u, i) => {
                    let rankDisplay = i + 1;
                    if(i === 0) rankDisplay = '<i class="fas fa-crown"></i>';
                    
                    list.innerHTML += `
                        <div class="l-item">
                            <div class="l-rank">${rankDisplay}</div>
                            <div class="l-name">${u.name}</div>
                            <div class="l-score">$${u.score.toFixed(2)}</div>
                        </div>
                    `;
                });
            });
        }

        // Partners List
        function loadPartners(code) {
            db.ref('users').orderByChild('referredBy').equalTo(code).on('value', snap => {
                const list = document.getElementById('partnerList');
                list.innerHTML = "";

                if(!snap.exists()) {
                    list.innerHTML = "<div style='text-align:center; color:#444; font-size:0.8rem;'>You haven't referred anyone yet.</div>";
                    return;
                }

                snap.forEach(child => {
                    const p = child.val();
                    const hasPlan = p.activePlan ? true : false;
                    const statusClass = hasPlan ? "active" : "";
                    const statusText = hasPlan ? "PREMIUM" : "FREE";
                    const badgeClass = hasPlan ? "act" : "";

                    list.innerHTML += `
                        <div class="p-item ${statusClass}">
                            <div class="p-info">
                                <div>${p.name}</div>
                                <div>ID: ${child.key.substring(0,6)}...</div>
                            </div>
                            <div class="p-status">
                                <span class="stat-badge ${badgeClass}">${statusText}</span>
                                <div style="font-size:0.7rem; color:#666; margin-top:3px;">Tasks: ${p.totalTasksDone || 0}</div>
                            </div>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
