<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Referral</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU", authDomain: "task38-f7daa.firebaseapp.com", databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com", projectId: "task38-f7daa", storageBucket: "task38-f7daa.firebasestorage.app", messagingSenderId: "655282407518", appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .back-btn { color: #d4af37; font-size: 1.5rem; cursor: pointer; }
        .page-title { font-size: 1.2rem; font-weight: 700; color: #d4af37; }

        .hero { text-align: center; background: linear-gradient(180deg, rgba(212, 175, 55, 0.1), transparent); padding: 30px; border-radius: 15px; border: 1px solid #333; margin-bottom: 25px; }
        .hero i { font-size: 3rem; color: #d4af37; margin-bottom: 10px; }
        
        .copy-card { background: #111; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .lbl { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; display: block; }
        .inp-grp { display: flex; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
        .inp-grp input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; outline: none; font-family: monospace; }
        .btn-copy { background: #d4af37; color: #000; border: none; padding: 0 20px; font-weight: bold; cursor: pointer; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #111; padding: 15px; text-align: center; border-radius: 10px; border: 1px solid #333; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #d4af37; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">INVITE</div>
        <div></div>
    </div>

    <div class="hero">
        <i class="fas fa-gift"></i>
        <h3>20% Commission</h3>
        <p style="color:#aaa; font-size:0.9rem;">+ Counts in Monthly/Weekly Targets</p>
    </div>

    <div class="copy-card">
        <span class="lbl">Your Referral Code</span>
        <div class="inp-grp">
            <input type="text" id="myCode" readonly value="...">
            <button class="btn-copy" onclick="copyTxt('myCode')">COPY</button>
        </div>
    </div>

    <div class="copy-card">
        <span class="lbl">Share Registration Link</span>
        <div class="inp-grp">
            <input type="text" id="myLink" readonly value="...">
            <button class="btn-copy" onclick="copyTxt('myLink')">COPY</button>
        </div>
    </div>

    <div class="stat-grid">
        <div class="stat-box">
            <div class="stat-val" id="totalRef">0</div>
            <div style="font-size:0.8rem; color:#aaa">Total Team</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="activeRef">0</div>
            <div style="font-size:0.8rem; color:#aaa">Active Plans</div>
        </div>
    </div>

    <script>
        // BASE URL SETTING
        const BASE_URL = "https://task28.github.io/-/Registration.html";

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        const code = data.myRefCode || "ERROR";
                        
                        document.getElementById('myCode').value = code;
                        // Construct Custom Link
                        document.getElementById('myLink').value = `${BASE_URL}?ref=${code}`;
                        
                        document.getElementById('totalRef').innerText = data.teamCount || 0;
                        
                        // Active Ref logic requires fetching sub-collection or complex query, 
                        // for now showing 0 or data.partnerCount if stored.
                        document.getElementById('activeRef').innerText = data.partnerCount || 0;
                    }
                });
            } else {
                window.location.href = "Login.html";
            }
        });

        function copyTxt(id) {
            const el = document.getElementById(id);
            el.select();
            el.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(el.value).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
