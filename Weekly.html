<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Weekly Target</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI", authDomain: "part-1-f6d87.firebaseapp.com", databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com", projectId: "part-1-f6d87", storageBucket: "part-1-f6d87.firebasestorage.app", messagingSenderId: "682699403122", appId: "1:682699403122:web:038ffca84d489a6c0db7eb" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        body { background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; padding-bottom: 60px; }
        .header { padding: 20px; display: flex; justify-content: space-between; background: rgba(10,10,10,0.9); border-bottom: 1px solid rgba(212,175,55,0.2); position: sticky; top: 0; z-index: 100; }
        .page-title { color: #d4af37; font-weight: 800; font-size: 1.1rem; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .credit-bal { text-align: center; margin-bottom: 20px; background: #111; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        
        .plan-card { 
            background: linear-gradient(145deg, #111, #0a0a0a); 
            padding: 20px; border-radius: 15px; margin-bottom: 15px;
            border: 1px solid #333; position: relative; overflow: hidden;
        }
        .p-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .p-name { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .p-reward { color: #2ecc71; font-weight: bold; font-size: 1.1rem; }
        
        .p-req { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; line-height: 1.6; }
        .hl { color: #d4af37; font-weight: bold; }

        .buy-btn { 
            width: 100%; padding: 12px; background: #d4af37; color: #000; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .buy-btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left" onclick="window.location.href='Home.html'" style="cursor:pointer; color:#fff;"></i>
        <div class="page-title">WEEKLY TARGETS</div>
        <div></div>
    </div>

    <div class="container">
        <div class="credit-bal">
            My Credits: <span id="myCredits" style="color:#d4af37; font-weight:bold;">Loading...</span>
        </div>

        <div id="planList">
            <div style="text-align:center; color:#666;">Loading Plans...</div>
        </div>
    </div>

    <script>
        const ADMIN_TELEGRAM = "RAFSAN_ART_CREATOR"; 
        let userCredits = 0;
        let myData = {};

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    myData = snap.val();
                    userCredits = myData.credits || 0;
                    document.getElementById('myCredits').innerText = userCredits;
                    loadPlans();
                });
            } else {
                window.location.href = 'registration_login.html';
            }
        });

        function loadPlans() {
            db.ref('targets/weekly').on('value', snap => {
                const list = document.getElementById('planList');
                list.innerHTML = "";
                
                if(!snap.exists()) {
                    list.innerHTML = "<p style='text-align:center'>No plans available.</p>"; return;
                }

                snap.forEach(child => {
                    const p = child.val();
                    const html = `
                        <div class="plan-card">
                            <div class="p-head">
                                <div class="p-name">${p.name}</div>
                                <div class="p-reward">Win $${p.reward}</div>
                            </div>
                            <div class="p-req">
                                • Referrals Needed: <span class="hl">${p.targetRef}</span><br>
                                • Downline Tasks: <span class="hl">${p.targetTask}</span><br>
                                • Duration: <span class="hl">${p.duration} Days</span>
                            </div>
                            <button class="buy-btn" onclick="buyPlan('${p.name}', ${p.cost}, ${p.reward}, ${p.targetRef}, ${p.targetTask})">
                                UNLOCK FOR ${p.cost} CREDITS <i class="fab fa-telegram"></i>
                            </button>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            });
        }

        function buyPlan(name, cost, reward, ref, task) {
            if(userCredits < cost) {
                alert("Insufficient Credits! You need " + cost + " credits."); return;
            }

            if(confirm(`Spend ${cost} Credits to unlock ${name}?`)) {
                // 1. Deduct Credit
                db.ref('users/' + auth.currentUser.uid).update({
                    credits: userCredits - cost
                }).then(() => {
                    // 2. Open Telegram
                    openTelegram(name, cost, reward, ref, task);
                });
            }
        }

        function openTelegram(name, cost, reward, ref, task) {
            const text = `
🎯 *TARGET PLAN REQUEST*
--------------------------
👤 *User:* ${myData.name}
📧 *Email:* ${myData.email}
🆔 *UID:* ${myData.uid}
--------------------------
📦 *Plan:* ${name} (Weekly)
💰 *Reward:* $${reward}
🎯 *Target:* ${ref} Refs & ${task} Tasks
💸 *Paid:* ${cost} Credits
--------------------------
I have paid credits. Please verify and activate.
            `.trim();

            const url = `https://t.me/${ADMIN_TELEGRAM}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
