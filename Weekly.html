<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Weekly Target</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU", authDomain: "task38-f7daa.firebaseapp.com", databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com", projectId: "task38-f7daa", storageBucket: "task38-f7daa.firebasestorage.app", messagingSenderId: "655282407518", appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        body { background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; padding: 20px; padding-bottom: 60px; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .back-btn { color: #d4af37; font-size: 1.5rem; cursor: pointer; }
        .page-title { font-size: 1.2rem; font-weight: 700; color: #d4af37; }

        /* DASHBOARD */
        #targetDashboard { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #d4af37; margin-bottom: 30px; display: none; }
        .dash-level { font-size: 1.5rem; color: #fff; text-align: center; font-weight: bold; }
        .timer { text-align: center; color: #e74c3c; font-family: monospace; margin: 10px 0 20px; }
        
        .progress-row { margin-bottom: 15px; }
        .p-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        .p-bar-bg { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .p-bar-fill { height: 100%; background: #2ecc71; width: 0%; transition: 0.5s; }

        /* LEVEL LIST */
        .levels-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .level-card { background: #141414; padding: 15px; border-radius: 12px; border-left: 5px solid #333; }
        .lvl-header { display: flex; justify-content: space-between; font-weight: bold; }
        .lvl-req { font-size: 0.85rem; color: #aaa; margin: 10px 0; }
        
        .select-btn { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .select-btn:hover { background: #d4af37; color: #000; }

        .credit-info { text-align: center; margin-bottom: 20px; color: #ccc; }
        .credit-val { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="window.location.href='Home.html'"></i>
        <div class="page-title">WEEKLY PLAN</div>
        <div></div>
    </div>

    <div class="credit-info">
        My Credits: <span id="myCredits" class="credit-val">...</span>
    </div>

    <!-- DASHBOARD -->
    <div id="targetDashboard">
        <div style="text-align:center; color:#aaa; font-size:0.8rem;">ACTIVE PLAN</div>
        <div class="dash-level" id="activeLevelName">LEVEL 1</div>
        <div class="timer" id="timerDisplay">Loading...</div>

        <div class="progress-row">
            <div class="p-label"><span>Referrals</span> <span id="refProg">0/0</span></div>
            <div class="p-bar-bg"><div class="p-bar-fill" id="refBar"></div></div>
        </div>
        <div class="progress-row">
            <div class="p-label"><span>Tasks</span> <span id="taskProg">0/0</span></div>
            <div class="p-bar-bg"><div class="p-bar-fill" id="taskBar"></div></div>
        </div>
        <div style="text-align:center; font-size:0.9rem;">Reward: $<span id="rewardAmt" style="color:#d4af37">0</span></div>
    </div>

    <!-- LIST -->
    <div id="levelList" class="levels-container"></div>

    <script>
        const COST = 1;
        const DURATION_DAYS = 7;
        
        const levels = [
            { id: 1, name: "Level 1", ref: 10, task: 20, reward: 1.2 },
            { id: 2, name: "Level 2", ref: 20, task: 40, reward: 2.4 },
            { id: 3, name: "Level 3", ref: 30, task: 60, reward: 3.6 },
            { id: 4, name: "Level 4", ref: 40, task: 80, reward: 4.8 },
            { id: 5, name: "Level 5", ref: 100, task: 150, reward: 9.0 },
            { id: 6, name: "Level 6", ref: 200, task: 350, reward: 21.0 }
        ];

        let userCredits = 0;
        let activePlan = null;

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    userCredits = data.credits || 0;
                    activePlan = data.activePlan || null;
                    document.getElementById('myCredits').innerText = userCredits;
                    renderUI(data);
                });
            } else {
                window.location.href = 'Login.html';
            }
        });

        function renderUI(userData) {
            const dashboard = document.getElementById('targetDashboard');
            const list = document.getElementById('levelList');
            
            if (activePlan) {
                list.style.display = 'none';
                dashboard.style.display = 'block';
                
                if(activePlan.type === 'weekly') {
                    const lvl = levels.find(l => l.id == activePlan.levelId);
                    document.getElementById('activeLevelName').innerText = lvl.name;
                    document.getElementById('rewardAmt').innerText = lvl.reward;

                    const curRef = userData.teamCount || 0;
                    const curTask = userData.totalTasksDone || 0;

                    document.getElementById('refProg').innerText = `${curRef} / ${lvl.ref}`;
                    document.getElementById('taskProg').innerText = `${curTask} / ${lvl.task}`;
                    
                    document.getElementById('refBar').style.width = Math.min((curRef/lvl.ref)*100, 100) + "%";
                    document.getElementById('taskBar').style.width = Math.min((curTask/lvl.task)*100, 100) + "%";

                    startTimer(activePlan.endTime);
                } else {
                    dashboard.innerHTML = "<h3 style='text-align:center'>MONTHLY PLAN ACTIVE</h3><p style='text-align:center'>Check Monthly Page.</p>";
                }
            } else {
                dashboard.style.display = 'none';
                list.style.display = 'grid';
                list.innerHTML = "";

                levels.forEach(lvl => {
                    const div = document.createElement('div');
                    div.className = "level-card";
                    div.innerHTML = `
                        <div class="lvl-header"><span>${lvl.name}</span> <span style="color:#d4af37">$${lvl.reward}</span></div>
                        <div class="lvl-req">${lvl.ref} Refs • ${lvl.task} Tasks</div>
                        <button class="select-btn" onclick="activateLevel(${lvl.id})">UNLOCK (1 Credit)</button>
                    `;
                    list.appendChild(div);
                });
            }
        }

        function activateLevel(lvlId) {
            if(userCredits < COST) { alert("Need 1 Credit!"); return; }
            if(confirm(`Start ${levels[lvlId-1].name} for 7 Days?`)) {
                const uid = auth.currentUser.uid;
                const now = Date.now();
                const endTime = now + (DURATION_DAYS * 24 * 60 * 60 * 1000);

                db.ref('users/' + uid).update({
                    credits: userCredits - COST,
                    activePlan: {
                        type: 'weekly',
                        levelId: lvlId,
                        startTime: now,
                        endTime: endTime
                    },
                    plan: 'weekly'
                }).then(() => alert("Weekly Plan Activated!"));
            }
        }

        function startTimer(endTime) {
            setInterval(() => {
                const now = Date.now();
                const diff = endTime - now;
                if (diff <= 0) {
                    document.getElementById('timerDisplay').innerText = "EXPIRED";
                } else {
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    document.getElementById('timerDisplay').innerText = `${d}d ${h}h`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
