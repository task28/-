<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>

            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI", 
            authDomain: "part-1-f6d87.firebaseapp.com", 
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",

        const db = firebase.database();
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            padding-bottom: 60px; 
            min-height: 100vh;
        }
        
        .header { 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(10,10,10,0.95); 
            border-bottom: 2px solid rgba(212,175,55,0.5); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .back-btn:hover { 
            background: #d4af37; 
            color: #000; 
            transform: translateX(-3px);
        }
        
        .page-title { 
            color: #d4af37; 
            font-weight: 800; 
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(212,175,55,0.3);
        }
        
        .container { 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        .credit-bal { 
            text-align: center; 
            margin-bottom: 30px; 
            background: linear-gradient(145deg, #1a1a1a, #111); 
            padding: 15px; 
            border-radius: 50px; 
            border: 1px solid rgba(212,175,55,0.3);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        .credit-bal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.2), transparent);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .plan-card { 
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f); 
            padding: 25px; 
            border-radius: 20px; 
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1); 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        
        .plan-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212,175,55,0.3);
            box-shadow: 0 15px 40px rgba(212,175,55,0.1);
        }
        
        .plan-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            opacity: 0.5;
        }
        
        .p-head { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        
        .p-name { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }
        
        .p-reward { 
            color: #2ecc71; 
            font-weight: bold; 
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(46,204,113,0.3);
        }
        
        .p-req { 
            font-size: 0.9rem; 
            color: #aaa; 
            margin-bottom: 20px; 
            line-height: 1.6; 
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid #d4af37;
        }
        
        .hl { 
            color: #d4af37; 
            font-weight: bold; 
        }

        .buy-btn { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #d4af37, #b8860b); 
            color: #000; 
            border: none; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .buy-btn:hover { 
            background: linear-gradient(135deg, #f1c40f, #d4af37);
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(212,175,55,0.4);
        }
        
        .buy-btn:active {
            transform: scale(0.98);
        }
        
        /* SOLD OUT STYLE */
        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .telegram-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,136,204,0.2);
            color: #00d2ff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 10px;
            border: 1px solid rgba(0,136,204,0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.location.href='Home.html'">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="page-title">MONTHLY TARGETS</div>
        <div style="width:40px;"></div>
    </div>

    <div class="container">
        <div class="credit-bal">
            <i class="fas fa-coins" style="color:#d4af37; margin-right:8px;"></i>
            My Credits: <span id="myCredits" style="color:#d4af37; font-weight:bold;">Loading...</span>
        </div>

        <div id="planList">
            <div style="text-align:center; color:#666; padding:20px;">
                <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; margin-bottom:10px; color:#d4af37;"></i><br>
                Loading Plans...
            </div>
        </div>
    </div>

    <script>
        const ADMIN_TELEGRAM = "RAFSAN_ART_CREATOR"; 
        let userCredits = 0;
        let myData = {};

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    if(snap.exists()) {
                        myData = snap.val();
                        userCredits = myData.credits || 0;
                        document.getElementById('myCredits').innerText = userCredits;
                        loadPlans();
                    }
                });
            } else {
                window.location.href = 'registration_login.html';
            }
        });

        function loadPlans() {
            db.ref('targets/monthly').on('value', snap => {
                const list = document.getElementById('planList');
                list.innerHTML = "";
                
                if(!snap.exists()) {
                    list.innerHTML = "<p style='text-align:center; color:#666; padding:20px;'>No plans available.</p>"; 
                    return;
                }

                snap.forEach(child => {
                    const p = child.val();
                    
                    // CHECK LIMIT LOGIC
                    const limit = p.limit || 1000;
                    const sold = p.sold || 0;
                    const isSoldOut = sold >= limit;

                    let buttonHtml = '';
                    if(isSoldOut) {
                        buttonHtml = `
                            <button class="buy-btn" disabled>
                                <i class="fas fa-lock"></i> SOLD OUT
                            </button>
                        `;
                    } else {
                        buttonHtml = `
                            <button class="buy-btn" onclick="buyPlan('${p.name}', ${p.cost}, ${p.reward}, ${p.targetRef}, ${p.targetTask})">
                                <i class="fab fa-telegram"></i> UNLOCK FOR ${p.cost} CREDITS
                            </button>
                        `;
                    }

                    const html = `
                        <div class="plan-card">
                            <div class="p-head">
                                <div class="p-name"><i class="fas fa-crown" style="color:#d4af37; margin-right:8px;"></i>${p.name}</div>
                                <div class="p-reward">$${p.reward}</div>
                            </div>
                            <div class="p-req">
                                <i class="fas fa-users" style="color:#d4af37; margin-right:5px;"></i> Referrals Needed: <span class="hl">${p.targetRef}</span><br>
                                <i class="fas fa-tasks" style="color:#d4af37; margin-right:5px;"></i> Downline Tasks: <span class="hl">${p.targetTask}</span><br>
                                <i class="fas fa-clock" style="color:#d4af37; margin-right:5px;"></i> Duration: <span class="hl">${p.duration} Days</span>
                            </div>
                            ${buttonHtml}
                            <div class="telegram-badge">
                                <i class="fas fa-check-circle"></i> Contact: @${ADMIN_TELEGRAM}
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            });
        }

        function buyPlan(name, cost, reward, ref, task) {
            if(userCredits < cost) {
                alert("Insufficient Credits! You need " + cost + " credits."); 
                return;
            }

            if(confirm(`Spend ${cost} Credits to unlock ${name}?`)) {
                db.ref('users/' + auth.currentUser.uid).update({
                    credits: userCredits - cost
                }).then(() => {
                    openTelegram(name, cost, reward, ref, task);
                });
            }
        }

        function openTelegram(name, cost, reward, ref, task) {
            const text = `
🎯 *MONTHLY TARGET REQUEST*
--------------------------
👤 *User:* ${myData.name}
📧 *Email:* ${myData.email}
🆔 *UID:* ${myData.uid}
--------------------------
📦 *Plan:* ${name} (Monthly)
💰 *Reward:* $${reward}
🎯 *Target:* ${ref} Refs & ${task} Tasks
💸 *Paid:* ${cost} Credits
--------------------------
I have paid credits. Please verify and activate.
            `.trim();

            const url = `https://t.me/${ADMIN_TELEGRAM}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
