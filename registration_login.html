<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TASK28 - Access Portal</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #1c1c1c, #2a2a72, #009ffd);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif; min-height: 100vh; color: #fff;
            padding: 20px;
        }

        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        .wrapper {
            width: 100%; max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; position: relative;
        }

        .tabs-header { display: flex; background: rgba(0,0,0,0.2); }
        
        .tab-btn {
            width: 50%; padding: 18px; border: none; background: transparent;
            color: #aaa; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: 0.3s; position: relative; outline: none;
        }
        .tab-btn.active { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5); box-shadow: 0 0 10px #00d2ff;
        }

        .form-content { padding: 30px 25px; min-height: 380px; }
        .form-box { display: none; animation: fadeIn 0.4s ease-in-out; }
        .form-box.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 25px; color: #fff; letter-spacing: 1px; }

        .input-group { position: relative; margin-bottom: 15px; }
        input {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        input:focus { background: rgba(255,255,255,0.12); border-color: #00d2ff; box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); }
        input::placeholder { color: #bbb; }
        input[readonly] { background: rgba(46, 204, 113, 0.15); border-color: #2ecc71; color: #2ecc71; font-weight: bold; }

        .btn-main {
            width: 100%; padding: 14px; margin-top: 15px;
            border: none; border-radius: 50px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); transition: 0.3s; text-transform: uppercase;
        }
        .btn-main:active { transform: scale(0.98); }

        .social-container { text-align: center; margin: 20px 0; }
        .social-container a {
            display: inline-flex; justify-content: center; align-items: center;
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1);
            color: #fff; margin: 0 5px; text-decoration: none; transition: 0.3s;
        }
        .social-container a:hover { background: #fff; color: #333; }

        .forgot-pass { display: block; text-align: right; font-size: 0.8rem; color: #ccc; margin-top: 10px; text-decoration: none; }
        .msg-box { background: rgba(255, 77, 77, 0.2); color: #ff9999; padding: 10px; border-radius: 5px; text-align: center; margin-top: 15px; font-size: 0.85rem; display: none; border: 1px solid rgba(255, 77, 77, 0.3); }

    </style>
</head>
<body>

    <div class="wrapper">
        <!-- TABS -->
        <div class="tabs-header">
            <button class="tab-btn active" onclick="openTab('signin')" id="tab-signin">Sign In</button>
            <button class="tab-btn" onclick="openTab('signup')" id="tab-signup">Sign Up</button>
        </div>

        <div class="form-content">
            
            <!-- SIGN IN FORM -->
            <div id="signin" class="form-box active">
                <h2>Welcome Back</h2>
                <div class="social-container">
                    <a href="#"><i class="fab fa-google"></i></a>
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                </div>
                
                <div class="input-group"><input type="email" id="l_email" placeholder="Email Address" /></div>
                <div class="input-group"><input type="password" id="l_pass" placeholder="Password" /></div>
                
                <a href="#" class="forgot-pass">Forgot Password?</a>
                <button class="btn-main" onclick="handleLogin(this)">Log In</button>
                <div id="loginMsg" class="msg-box">Error Message</div>
            </div>

            <!-- SIGN UP FORM -->
            <div id="signup" class="form-box">
                <h2>Create Account</h2>
                
                <div class="input-group"><input type="text" id="r_name" placeholder="Full Name" /></div>
                <div class="input-group"><input type="email" id="r_email" placeholder="Email Address" /></div>
                <div class="input-group"><input type="password" id="r_pass" placeholder="Password (Min 6 chars)" /></div>
                <div class="input-group"><input type="password" id="r_passConfirm" placeholder="Confirm Password" /></div>
                <div class="input-group"><input type="text" id="r_refCode" placeholder="Referral Code (Required)" /></div>

                <button class="btn-main" onclick="handleRegister(this)">Register</button>
                <div id="regMsg" class="msg-box">Error Message</div>
            </div>
        </div>
    </div>

    <script>
        // --- TABS & URL PARAMS ---
        function openTab(tabName) {
            document.querySelectorAll('.form-box').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if(ref) {
                openTab('signup');
                const refInput = document.getElementById('r_refCode');
                refInput.value = ref;
                refInput.readOnly = true; 
            }
        };

        // --- REGISTER WITH RECURSIVE TEAM UPDATE ---
        function handleRegister(btn) {
            const name = document.getElementById('r_name').value;
            const email = document.getElementById('r_email').value;
            const pass = document.getElementById('r_pass').value;
            const confirmPass = document.getElementById('r_passConfirm').value;
            const refCode = document.getElementById('r_refCode').value.trim();
            const msgBox = document.getElementById('regMsg');

            if(!name || !email || !pass || !confirmPass || !refCode) {
                showError(msgBox, "All fields are required."); return;
            }
            if(pass.length < 6) {
                showError(msgBox, "Password must be at least 6 characters."); return;
            }
            if(pass !== confirmPass) {
                showError(msgBox, "Passwords do not match!"); return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.style.opacity = "0.7";

            // 1. Verify Referrer Code
            db.ref('users').orderByChild('myRefCode').equalTo(refCode).once('value', snapshot => {
                if(!snapshot.exists()) {
                    showError(msgBox, "Invalid Referral Code!");
                    resetBtn(btn, "Register");
                    return;
                }

                // 2. Create Auth User
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    const uid = cred.user.uid;
                    const myCode = "TASK" + Math.floor(100000 + Math.random() * 900000);
                    const today = new Date().toLocaleDateString('en-CA');

                    const userData = {
                        name: name, email: email, password: pass, uid: uid,
                        balance: 0, credits: 2, 
                        todayProfit: 0, totalProfit: 0, 
                        teamCount: 0, partnerCount: 0, 
                        regDate: today, myRefCode: myCode, 
                        referredBy: refCode, plan: "free"
                    };

                    // 3. Save User & Update Uplines
                    db.ref('users/' + uid).set(userData).then(() => {
                        updateUplineCounts(refCode); // RECURSIVE UPDATE CALL
                        
                        alert("Account Created Successfully!");
                        window.location.href = "Home.html";
                    });

                }).catch(err => {
                    showError(msgBox, err.message);
                    resetBtn(btn, "Register");
                });
            });
        }

        // --- RECURSIVE FUNCTION (User A <- User B <- User C) ---
        async function updateUplineCounts(startRefCode) {
            let currentCode = startRefCode;
            let loopLimit = 50; // Safety limit

            while (currentCode && currentCode !== "Admin" && loopLimit > 0) {
                const snapshot = await db.ref('users').orderByChild('myRefCode').equalTo(currentCode).once('value');
                
                if (snapshot.exists()) {
                    let uplineUid = null;
                    let uplineData = null;

                    snapshot.forEach(child => {
                        uplineUid = child.key;
                        uplineData = child.val();
                    });

                    if (uplineUid) {
                        // Increase Team Count
                        const newTeamCount = (uplineData.teamCount || 0) + 1;
                        await db.ref('users/' + uplineUid).update({ teamCount: newTeamCount });

                        // Move Up
                        currentCode = uplineData.referredBy;
                        loopLimit--;
                    } else {
                        break;
                    }
                } else {
                    break;
                }
            }
        }

        // --- LOGIN LOGIC ---
        function handleLogin(btn) {
            const email = document.getElementById('l_email').value;
            const pass = document.getElementById('l_pass').value;
            const msgBox = document.getElementById('loginMsg');

            if(!email || !pass) { showError(msgBox, "Please fill all fields."); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
            btn.style.opacity = "0.7";

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    if(email === "rafsanvai388@gmail.com") window.location.href = "Admin_home.html";
                    else window.location.href = "Home.html";
                })
                .catch((error) => {
                    showError(msgBox, "Invalid Email or Password");
                    resetBtn(btn, "Log In");
                });
        }

        function showError(el, msg) { el.innerText = msg; el.style.display = 'block'; }
        function resetBtn(btn, txt) { btn.innerHTML = txt; btn.style.opacity = "1"; }

    </script>
</body>
</html>
