<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TASK28 - Access Portal</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuxSz3j5xMYDw5U9kLA0cjkpOE82D06MI",
            authDomain: "part-1-f6d87.firebaseapp.com",
            databaseURL: "https://part-1-f6d87-default-rtdb.firebaseio.com",
            projectId: "part-1-f6d87",
            storageBucket: "part-1-f6d87.firebasestorage.app",
            messagingSenderId: "682699403122",
            appId: "1:682699403122:web:038ffca84d489a6c0db7eb"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #1c1c1c, #2a2a72, #009ffd);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif; min-height: 100vh; color: #fff;
            padding: 20px;
        }

        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        .wrapper {
            width: 100%; max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; position: relative;
        }

        .tabs-header { display: flex; background: rgba(0,0,0,0.2); }
        
        .tab-btn {
            width: 50%; padding: 18px; border: none; background: transparent;
            color: #aaa; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: 0.3s; position: relative; outline: none;
        }
        .tab-btn.active { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5); box-shadow: 0 0 10px #00d2ff;
        }

        .form-content { padding: 30px 25px; min-height: 380px; }
        .form-box { display: none; animation: fadeIn 0.4s ease-in-out; }
        .form-box.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 25px; color: #fff; letter-spacing: 1px; }

        .input-group { 
            position: relative; 
            margin-bottom: 15px; 
        }
        
        .input-group .left-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #888; font-size: 0.9rem; pointer-events: none;
        }
        
        .input-group .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: #888; font-size: 0.9rem; cursor: pointer; transition: 0.3s; z-index: 2;
        }
        .input-group .toggle-password:hover { color: #00d2ff; }
        
        input {
            width: 100%; padding: 12px 40px; 
            background: rgba(255,255,255,0.07); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        input:focus { 
            background: rgba(255,255,255,0.12); border-color: #00d2ff; box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); 
        }
        input::placeholder { color: #bbb; }
        input[readonly] { 
            background: rgba(46, 204, 113, 0.15); border-color: #2ecc71; color: #2ecc71; font-weight: bold; 
        }

        .btn-main {
            width: 100%; padding: 14px; margin-top: 15px;
            border: none; border-radius: 50px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); transition: 0.3s; text-transform: uppercase;
            position: relative; overflow: hidden;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4); }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .social-container { text-align: center; margin: 20px 0; }
        .social-container a {
            display: inline-flex; justify-content: center; align-items: center;
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1);
            color: #fff; margin: 0 5px; text-decoration: none; transition: 0.3s;
        }
        .social-container a:hover { background: #fff; color: #333; transform: translateY(-3px); }

        .forgot-pass { 
            display: block; text-align: right; font-size: 0.8rem; color: #ccc; margin-top: 10px; text-decoration: none; transition: 0.3s; 
        }
        .forgot-pass:hover { color: #00d2ff; }
        
        .msg-box { 
            background: rgba(255, 77, 77, 0.2); color: #ff9999; padding: 12px; border-radius: 5px; 
            text-align: center; margin-top: 15px; font-size: 0.85rem; display: none; 
            border: 1px solid rgba(255, 77, 77, 0.3); animation: shake 0.5s;
        }
        .msg-box.success { 
            background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="tabs-header">
            <button class="tab-btn active" onclick="openTab('signin')" id="tab-signin">Sign In</button>
            <button class="tab-btn" onclick="openTab('signup')" id="tab-signup">Sign Up</button>
        </div>

        <div class="form-content">
            <!-- SIGN IN FORM -->
            <div id="signin" class="form-box active">
                <h2>Welcome Back</h2>
                <div class="social-container">
                    <a href="#" onclick="socialLogin('google')"><i class="fab fa-google"></i></a>
                    <a href="#" onclick="socialLogin('facebook')"><i class="fab fa-facebook-f"></i></a>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope left-icon"></i>
                    <input type="email" id="l_email" placeholder="Email Address" autocomplete="email"/>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock left-icon"></i>
                    <input type="password" id="l_pass" placeholder="Password" autocomplete="current-password"/>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('l_pass', this)"></i>
                </div>
                <a href="#" class="forgot-pass" onclick="resetPassword()">Forgot Password?</a>
                <button class="btn-main" id="loginBtn" onclick="handleLogin(this)">Log In</button>
                <div id="loginMsg" class="msg-box"></div>
            </div>

            <!-- SIGN UP FORM -->
            <div id="signup" class="form-box">
                <h2>Create Account</h2>
                <div class="input-group">
                    <i class="fas fa-user left-icon"></i>
                    <input type="text" id="r_name" placeholder="Full Name" autocomplete="name"/>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope left-icon"></i>
                    <input type="email" id="r_email" placeholder="Email Address" autocomplete="email"/>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock left-icon"></i>
                    <input type="password" id="r_pass" placeholder="Password (Min 6 chars)" autocomplete="new-password"/>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('r_pass', this)"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock left-icon"></i>
                    <input type="password" id="r_passConfirm" placeholder="Confirm Password" autocomplete="new-password"/>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('r_passConfirm', this)"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-gift left-icon"></i>
                    <input type="text" id="r_refCode" placeholder="Ref Code (Use 'ADMIN' if first)" autocomplete="off"/>
                </div>
                <button class="btn-main" id="regBtn" onclick="handleRegister(this)">Register</button>
                <div id="regMsg" class="msg-box"></div>
            </div>
        </div>
    </div>

    <script>
        // --- UI LOGIC ---
        function openTab(tabName) {
            document.querySelectorAll('.form-box').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
            hideMsg('loginMsg'); hideMsg('regMsg');
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if(input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // --- AUTH & REDIRECT ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('ref')) {
                openTab('signup');
                const refInput = document.getElementById('r_refCode');
                refInput.value = urlParams.get('ref').toUpperCase();
                refInput.readOnly = true; 
            }
            
            auth.onAuthStateChanged(user => {
                if(user) {
                    // Check Admin Email
                    if(user.email.toLowerCase() === "rafsanvai388@gmail.com") {
                        window.location.href = "Admin_home.html";
                    } else {
                        window.location.href = "Home.html";
                    }
                }
            });
        };

        // --- HELPERS ---
        function showError(elId, msg) {
            const el = document.getElementById(elId);
            el.innerText = msg; el.classList.remove('success'); el.style.display = 'block';
            setTimeout(() => hideMsg(elId), 5000);
        }
        function showSuccess(elId, msg) {
            const el = document.getElementById(elId);
            el.innerText = msg; el.classList.add('success'); el.style.display = 'block';
        }
        function hideMsg(elId) { document.getElementById(elId).style.display = 'none'; }
        
        function setLoading(btn, isLoading, defaultText) {
            if(isLoading) {
                btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Processing...';
            } else {
                btn.disabled = false; btn.innerText = defaultText;
            }
        }

        function generateRefCode() { return "TASK" + Math.floor(100000 + Math.random() * 900000); }
        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

        // --- REGISTER LOGIC (FIXED) ---
        function handleRegister(btn) {
            const name = document.getElementById('r_name').value.trim();
            const email = document.getElementById('r_email').value.trim();
            const pass = document.getElementById('r_pass').value;
            const confirmPass = document.getElementById('r_passConfirm').value;
            const refCode = document.getElementById('r_refCode').value.trim().toUpperCase();

            if(!name || !email || !pass || !refCode) return showError('regMsg', "All fields required.");
            if(pass !== confirmPass) return showError('regMsg', "Passwords do not match.");
            if(pass.length < 6) return showError('regMsg', "Password min 6 chars.");
            if(!validateEmail(email)) return showError('regMsg', "Invalid email.");

            setLoading(btn, true, "Register");

            // CHECK REFERRAL CODE (ALLOW 'ADMIN' BYPASS)
            const checkRef = (refCode === "ADMIN") 
                ? Promise.resolve({ exists: () => true, key: "Admin_System" }) 
                : db.ref('users').orderByChild('myRefCode').equalTo(refCode).once('value');

            checkRef.then(snapshot => {
                if(!snapshot.exists()) {
                    throw new Error("Invalid Referral Code! Use 'ADMIN' if you are the first user.");
                }
                
                let referrerUid = null;
                if(refCode !== "ADMIN") {
                    snapshot.forEach(child => { referrerUid = child.key; });
                }

                // CREATE USER
                return auth.createUserWithEmailAndPassword(email, pass).then(cred => {
                    return { cred, referrerUid };
                });
            })
            .then(data => {
                const uid = data.cred.user.uid;
                const myCode = generateRefCode();
                const today = new Date().toISOString().split('T')[0];

                const userData = {
                    name: name, email: email, uid: uid, // Explicitly saving UID
                    balance: 0.00, credits: 2, todayProfit: 0.00, 
                    totalEarnings: 0.00, teamCount: 0, partnerCount: 0, 
                    regDate: today, myRefCode: myCode, 
                    referredBy: refCode, referredByUid: data.referrerUid || 'admin',
                    plan: "free", status: "active",
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                };

                // Store User Data and Update Referrer Logic
                return db.ref('users/' + uid).set(userData).then(() => {
                     if(data.referrerUid && refCode !== "ADMIN") {
                         // FIX: Update Immediate Referrer (Partner Count + 1)
                         // And Update Total Team Logic
                         return updateReferralStats(data.referrerUid);
                     }
                });
            })
            .then(() => {
                showSuccess('regMsg', "Success! Redirecting...");
                // Redirect handled by onAuthStateChanged
            })
            .catch(err => {
                console.error(err);
                let msg = err.message;
                if(err.code === 'auth/email-already-in-use') msg = "Email already used.";
                showError('regMsg', msg);
                setLoading(btn, false, "Register");
                
                // Safety: Sign out if DB failed but Auth worked
                if(auth.currentUser) auth.signOut();
            });
        }

        // --- FIXED UPLINE UPDATE (Recursive) ---
        async function updateReferralStats(directReferrerUid) {
            try {
                // 1. Update Immediate Referrer (Partner + Team)
                await db.ref('users/' + directReferrerUid).transaction(data => {
                    if (data) {
                        data.partnerCount = (data.partnerCount || 0) + 1;
                        data.teamCount = (data.teamCount || 0) + 1;
                    }
                    return data;
                });

                // 2. Get Referrer's Referrer Code to continue up the chain
                const snap = await db.ref('users/' + directReferrerUid + '/referredBy').once('value');
                const uplineCode = snap.val();

                if(uplineCode && uplineCode !== 'ADMIN') {
                    await updateTeamCountOnly(uplineCode, 20); // Limit to 20 levels
                }
            } catch (e) {
                console.error("Referral Update Error:", e);
            }
        }

        async function updateTeamCountOnly(refCode, levelsLeft) {
            if(levelsLeft <= 0 || refCode === 'ADMIN') return;

            const snap = await db.ref('users').orderByChild('myRefCode').equalTo(refCode).once('value');
            if(!snap.exists()) return;

            let uid = Object.keys(snap.val())[0];
            let nextRefCode = snap.val()[uid].referredBy;

            // Increment Team Count Only
            await db.ref('users/' + uid + '/teamCount').transaction(count => (count || 0) + 1);

            // Continue Up
            if(nextRefCode) {
                await updateTeamCountOnly(nextRefCode, levelsLeft - 1);
            }
        }

        // --- LOGIN LOGIC ---
        function handleLogin(btn) {
            const email = document.getElementById('l_email').value.trim();
            const pass = document.getElementById('l_pass').value;

            if(!email || !pass) return showError('loginMsg', "Empty fields.");
            setLoading(btn, true, "Log In");

            auth.signInWithEmailAndPassword(email, pass)
            .then((cred) => {
                // Check ban status
                return db.ref('users/' + cred.user.uid + '/status').once('value');
            })
            .then(snap => {
                if(snap.val() === 'banned') {
                    auth.signOut();
                    throw new Error("Account Banned.");
                }
                // Redirect handled by onAuthStateChanged
            })
            .catch(err => {
                showError('loginMsg', err.message);
                setLoading(btn, false, "Log In");
            });
        }

        function resetPassword() {
            const email = document.getElementById('l_email').value.trim();
            if(!email) return showError('loginMsg', "Enter email first.");
            auth.sendPasswordResetEmail(email)
                .then(() => showSuccess('loginMsg', "Reset link sent!"))
                .catch(e => showError('loginMsg', e.message));
        }

        function socialLogin() { alert("Coming Soon!"); }
    </script>
</body>
</html>
