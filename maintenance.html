<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #FFD700; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .icon { font-size: 4rem; margin-bottom: 20px; animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h1 { margin: 0; font-size: 2rem; }
        p { color: #fff; opacity: 0.7; max-width: 300px; margin-top: 10px; }
    </style>
</head>
<body>
    <i class="fas fa-cog icon"></i>
    <h1>MAINTENANCE</h1>
    <p>We are updating the system. Please come back later.</p>
    <div style="margin-top:20px; font-size:0.8rem; color:#555;">Status: Checking...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Check if site is back ON
        onValue(ref(db, 'settings/siteStatus'), (snap) => {
            const isOn = snap.val();
            if (isOn === true) {
                window.location.href = "index.html"; // Go back to home when ON
            }
        });
    </script>
</body>
</html>
