<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Register</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU", authDomain: "task38-f7daa.firebaseapp.com", databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com", projectId: "task38-f7daa", storageBucket: "task38-f7daa.firebasestorage.app", messagingSenderId: "655282407518", appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: radial-gradient(circle at center, #141414 0%, #000000 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; color: #fff; padding: 20px 0; }
        .reg-card { background: rgba(20, 20, 20, 0.85); width: 100%; max-width: 450px; padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); position: relative; backdrop-filter: blur(10px); margin: 20px; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo-text { font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #bf953f, #fcf6ba, #aa771c); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i.icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #d4af37; }
        .form-control { width: 100%; background: #0a0a0a; border: 1px solid #333; padding: 14px 15px 14px 45px; border-radius: 10px; color: #fff; font-family: 'Montserrat', sans-serif; transition: 0.3s; }
        .form-control:focus { border-color: #d4af37; }
        
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; }
        .btn-reg { width: 100%; padding: 15px; margin-top: 10px; background: linear-gradient(45deg, #b8860b, #d4af37, #f1c40f, #b8860b); background-size: 300%; border: none; border-radius: 10px; color: #000; font-weight: 700; cursor: pointer; transition: 0.4s; }
        .btn-reg:hover { background-position: 100% 0; }
        #errorMsg { color: #ff4d4d; font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="header">
            <div class="logo-text">CREATE ACCOUNT</div>
            <p style="color:#aaa; font-size:0.8rem;">Join now & Get 2 Credits Free!</p>
        </div>

        <div id="errorMsg">Error message here</div>

        <div class="input-group">
            <i class="fas fa-user icon"></i>
            <input type="text" id="name" class="form-control" placeholder="Full Name">
        </div>
        <div class="input-group">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="email" class="form-control" placeholder="Gmail Address">
        </div>
        <div class="input-group">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="pass" class="form-control" placeholder="Password">
            <i class="fas fa-eye toggle-pass" onclick="togglePass('pass', this)"></i>
        </div>
        <div class="input-group">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="cpass" class="form-control" placeholder="Confirm Password">
        </div>
        <div class="input-group">
            <i class="fas fa-users icon"></i>
            <!-- Required Referral Code -->
            <input type="text" id="refCode" class="form-control" placeholder="Referral Code (Required)">
        </div>
        <div class="input-group">
            <i class="fas fa-gift icon"></i>
            <input type="text" id="bonusCode" class="form-control" placeholder="Bonus Code (Optional)">
        </div>

        <button class="btn-reg" onclick="handleRegister()">REGISTER NOW</button>
        <p style="text-align:center; margin-top:15px; font-size:0.9rem;">Already member? <a href="Login.html" style="color:#d4af37;">Login</a></p>
    </div>

    <script>
        // 1. Auto Fill Referral Code from URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if(ref) {
                document.getElementById('refCode').value = ref;
                document.getElementById('refCode').readOnly = true; // Lock field if came from link
                document.getElementById('refCode').style.background = "#1a1a1a";
            }
        };

        function togglePass(id, icon) {
            const x = document.getElementById(id);
            if (x.type === "password") { x.type = "text"; icon.style.color = "#d4af37"; } 
            else { x.type = "password"; icon.style.color = "#666"; }
        }

        function handleRegister() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const cpass = document.getElementById('cpass').value;
            const refCode = document.getElementById('refCode').value.trim();
            const bonusCode = document.getElementById('bonusCode').value.trim().toUpperCase();
            const btn = document.querySelector('.btn-reg');

            if(!name || !email || !pass || !refCode) { showError("Please fill all fields (Referral is Required)"); return; }
            if(pass !== cpass) { showError("Passwords do not match"); return; }
            if(pass.length < 6) { showError("Password min 6 chars"); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CREATING...';
            btn.style.opacity = "0.7";

            // Check Bonus Code Logic
            db.ref('bonusCodes/' + bonusCode).once('value').then(snap => {
                let startBal = 0;
                let startCred = 2; // Default 2 Credits for everyone

                if(bonusCode && snap.exists()) {
                    const bData = snap.val();
                    if(bData.type === 'balance') startBal = parseFloat(bData.amount);
                    if(bData.type === 'credit') startCred += parseInt(bData.amount); // Add extra credits
                } else if(bonusCode && !snap.exists()) {
                    showError("Invalid Bonus Code"); btn.innerHTML = "REGISTER"; btn.style.opacity = "1"; return;
                }

                // Create Account
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    const uid = cred.user.uid;
                    const myCode = "TASK" + Math.floor(100000 + Math.random() * 900000);
                    const today = new Date().toISOString().split('T')[0];

                    // Save User Data
                    db.ref('users/' + uid).set({
                        name: name, email: email, password: pass, uid: uid,
                        balance: startBal, credits: startCred, 
                        todayProfit: 0, totalProfit: 0, teamCount: 0, partnerCount: 0,
                        regDate: today, myRefCode: myCode, referredBy: refCode, plan: "free"
                    }).then(() => {
                        // UPDATE REFERRER STATS (Target Connection)
                        updateReferrer(refCode);
                        
                        alert("Registration Successful! 2 Credits Added.");
                        window.location.href = "Home.html";
                    });
                }).catch(err => {
                    showError(err.message);
                    btn.innerHTML = "REGISTER NOW";
                    btn.style.opacity = "1";
                });
            });
        }

        function updateReferrer(code) {
            // Find user who owns this referral code
            db.ref('users').orderByChild('myRefCode').equalTo(code).once('value', snap => {
                if(snap.exists()) {
                    snap.forEach(u => {
                        const refUid = u.key;
                        const data = u.val();
                        
                        // 1. Update Team Count
                        let updates = { teamCount: (data.teamCount || 0) + 1 };
                        
                        // 2. Update Plan Target (Monthly/Weekly)
                        if(data.activePlan) {
                            // Backend: activePlan.currentRef tracks target progress
                            // Logic: user needs to manually update this object structure
                            const currentRef = (data.activePlan.currentRef || 0) + 1;
                            updates['activePlan/currentRef'] = currentRef;
                        }

                        db.ref('users/' + refUid).update(updates);
                    });
                }
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg; el.style.display = 'block';
        }
    </script>
</body>
</html>
