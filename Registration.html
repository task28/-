<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK28 - Join Us</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDR38gO9SBcE3qcVvFHlpyE5YdEqo0n2XU",
            authDomain: "task38-f7daa.firebaseapp.com",
            databaseURL: "https://task38-f7daa-default-rtdb.firebaseio.com",
            projectId: "task38-f7daa",
            storageBucket: "task38-f7daa.firebasestorage.app",
            messagingSenderId: "655282407518",
            appId: "1:655282407518:web:637dd6ac82b6c5e6018ccf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background: radial-gradient(circle at center, #141414 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            padding: 20px 0;
        }

        .bg-glow {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            background: #d4af37; filter: blur(180px); opacity: 0.15; z-index: 0; pointer-events: none;
        }

        .reg-card {
            background: rgba(20, 20, 20, 0.85);
            width: 100%; max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            position: relative; z-index: 1;
            backdrop-filter: blur(10px);
            margin: 20px;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .logo-text {
            font-size: 2rem; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #aa771c);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .sub-text { color: #888; font-size: 0.85rem; letter-spacing: 1px; margin-top: 5px; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i.icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #d4af37; font-size: 1rem;
        }
        .form-control {
            width: 100%; background: #0a0a0a; border: 1px solid #333;
            padding: 14px 15px 14px 45px; border-radius: 10px;
            color: #fff; font-family: 'Montserrat', sans-serif; font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
        
        .toggle-pass {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: #666; cursor: pointer; transition: 0.3s;
        }
        .toggle-pass:hover { color: #d4af37; }

        .btn-reg {
            width: 100%; padding: 15px; margin-top: 10px;
            background: linear-gradient(45deg, #b8860b, #d4af37, #f1c40f, #b8860b);
            background-size: 300% 100%; border: none; border-radius: 10px;
            color: #000; font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: 0.4s; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-reg:hover { background-position: 100% 0; transform: translateY(-2px); }

        .footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
        .footer a { color: #d4af37; text-decoration: none; font-weight: 600; }

        #errorMsg { color: #ff4d4d; font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="reg-card">
        <div class="header">
            <div class="logo-text">CREATE ACCOUNT</div>
            <div class="sub-text">Join TASK28 Premium Network</div>
        </div>

        <div id="errorMsg">Error message here</div>

        <div class="input-group">
            <i class="fas fa-user icon"></i>
            <input type="text" id="name" class="form-control" placeholder="Full Name">
        </div>

        <div class="input-group">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="email" class="form-control" placeholder="Gmail Address">
        </div>

        <div class="input-group">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="pass" class="form-control" placeholder="Password">
            <i class="fas fa-eye toggle-pass" onclick="togglePass('pass', this)"></i>
        </div>

        <div class="input-group">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="cpass" class="form-control" placeholder="Confirm Password">
            <i class="fas fa-eye toggle-pass" onclick="togglePass('cpass', this)"></i>
        </div>

        <div class="input-group">
            <i class="fas fa-users icon"></i>
            <input type="text" id="refCode" class="form-control" placeholder="Referral Code (Optional)">
        </div>

        <div class="input-group">
            <i class="fas fa-gift icon"></i>
            <input type="text" id="bonusCode" class="form-control" placeholder="Bonus Code (Optional)">
        </div>

        <button class="btn-reg" onclick="handleRegister()">REGISTER NOW</button>

        <div class="footer">
            Already a member? <a href="Login.html">Login Here</a>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        function togglePass(fieldId, icon) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                icon.style.color = "#d4af37";
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                icon.style.color = "#666";
            }
        }

        // --- MAIN REGISTRATION LOGIC WITH BONUS ---
        function handleRegister() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const cpass = document.getElementById('cpass').value;
            const refCode = document.getElementById('refCode').value;
            const bonusCode = document.getElementById('bonusCode').value.trim().toUpperCase();
            
            const btn = document.querySelector('.btn-reg');
            const errDiv = document.getElementById('errorMsg');

            // 1. Basic Validation
            if(!name || !email || !pass || !cpass) { showError("Fill all fields."); return; }
            if(pass !== cpass) { showError("Passwords do not match."); return; }
            if(pass.length < 6) { showError("Password must be 6+ chars."); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> VERIFYING...';
            btn.style.opacity = "0.7";

            // 2. Bonus Code Check
            db.ref('bonusCodes/' + bonusCode).once('value').then(snap => {
                
                let startBalance = 0;
                let startCredit = 0;

                // If user entered a code, check validity
                if(bonusCode !== "") {
                    if(snap.exists()) {
                        const bData = snap.val();
                        if(bData.type === 'balance') startBalance = parseFloat(bData.amount);
                        if(bData.type === 'credit') startCredit = parseInt(bData.amount);
                    } else {
                        showError("Invalid Bonus Code! Clear it or use a valid one.");
                        btn.innerHTML = 'REGISTER NOW';
                        btn.style.opacity = "1";
                        return; // Stop Registration
                    }
                }

                // 3. Create Firebase Auth User
                auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                    const uid = cred.user.uid;
                    const myRefCode = "TASK" + Math.floor(100000 + Math.random() * 900000);
                    const today = new Date().toISOString().split('T')[0];

                    // 4. Save User Data
                    db.ref('users/' + uid).set({
                        name: name,
                        email: email,
                        password: pass,
                        uid: uid,
                        balance: startBalance,   // Bonus Added
                        credits: startCredit,    // Bonus Added
                        todayProfit: 0,
                        totalProfit: 0,
                        teamCount: 0,
                        partnerCount: 0,
                        regDate: today,
                        myRefCode: myRefCode,
                        referredBy: refCode || "none",
                        plan: "free",
                        isBanned: false
                    }).then(() => {
                        alert("Account Created Successfully! Welcome.");
                        window.location.href = "Home.html";
                    });

                }).catch((error) => {
                    showError(error.message);
                    btn.innerHTML = 'REGISTER NOW';
                    btn.style.opacity = "1";
                });
            });
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
