<!-- FIREBASE SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    // runTransaction import করা হয়েছে ডাটা সঠিকভাবে আপডেট করার জন্য
    import { getDatabase, ref, set, query, orderByChild, equalTo, get, update, runTransaction } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyB2YLhAvSF12ZZx7LSnbqcCjtS2_8QLt4o", authDomain: "task-f6078.firebaseapp.com", databaseURL: "https://task-f6078-default-rtdb.firebaseio.com", projectId: "task-f6078", storageBucket: "task-f6078.firebasestorage.app", messagingSenderId: "887907470692", appId: "1:887907470692:web:c4142ac9573e19d29d3e71" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- TAB SWITCHING ---
    window.showForm = (form) => {
        const loginForm = document.getElementById('loginForm');
        const regForm = document.getElementById('registerForm');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');

        if(form === 'login'){
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
        } else {
            loginForm.classList.add('hidden');
            regForm.classList.remove('hidden');
            tabLogin.classList.remove('active');
            tabRegister.classList.add('active');
        }
    };

    // --- AUTO FILL REFERRAL ---
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('ref');
        if(refParam) {
            const refInput = document.getElementById('regRef');
            if(refInput) {
                refInput.value = refParam;
                refInput.dispatchEvent(new Event('input')); 
            }
            window.showForm('register');
        }
    };

    // --- REGISTER LOGIC ---
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;

        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const pass = document.getElementById('regPass').value;
        const confirmPass = document.getElementById('regConfirmPass').value;
        let refCode = document.getElementById('regRef').value.trim();

        if(pass !== confirmPass) { 
            alert("Passwords do not match"); 
            btn.innerText = originalText;
            btn.disabled = false;
            return; 
        }

        const email = phone + "@myapp.com";

        try {
            // 1. Create User
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;
            
            // Generate Code
            let cleanName = name.replace(/\s/g, '');
            if(cleanName.length < 3) cleanName += "XXX";
            const myRefCode = cleanName.substring(0,3).toUpperCase() + phone.substring(phone.length - 4);

            // 2. Save User Data
            await set(ref(db, 'users/' + user.uid), {
                name: name,
                phone: phone,
                balance: 0,
                referralCode: myRefCode,
                referredBy: refCode || "None",
                joiningDate: new Date().toLocaleDateString(),
                password: pass
            });

            // 3. REFERRAL BONUS LOGIC
            if(refCode) {
                await checkAndAddReferralPoint(refCode);
            }

            alert("Registration Successful!");
            window.location.href = "home.html";
        } catch (error) {
            alert("Error: " + error.message);
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });

    // --- FIXED REFERRAL LOGIC ---
    async function checkAndAddReferralPoint(code) {
        try {
            const usersRef = ref(db, 'users');
            // Find user by referral code
            const q = query(usersRef, orderByChild('referralCode'), equalTo(code));
            const snapshot = await get(q);

            if (snapshot.exists()) {
                const referrerUid = Object.keys(snapshot.val())[0];
                const referrerData = snapshot.val()[referrerUid];

                // Check if they have an active target
                if (referrerData.target && referrerData.target.status === 'active') {
                    
                    // Use Transaction to safely increment
                    const targetRefRef = ref(db, `users/${referrerUid}/target/currentRef`);
                    
                    await runTransaction(targetRefRef, (currentCount) => {
                        return (currentCount || 0) + 1;
                    });

                    // (Optional Debug) Uncomment to test
                    // alert("Referral Point Added to: " + referrerData.name);
                } else {
                    // alert("Referrer found but NO Active Target.");
                }
            } else {
                console.log("Invalid Referral Code used.");
            }
        } catch (err) {
            console.error("Referral Logic Error:", err);
        }
    }

    // --- LOGIN LOGIC ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('loginPhone').value;
        const pass = document.getElementById('loginPass').value;
        const email = phone + "@myapp.com";

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            window.location.href = "home.html";
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    });
</script>
